<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6FA">
<title>Crew Wages</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Crew Wages">
<style>
:root{
  --bg:#F5F6FA; --card:#FFFFFF; --ink:#0E1325; --ink2:#3B4256; --mut:#7A8299; --line:#E9EBF2; --soft:#F0F1F6;
  --acc:#4F46E5; --acc-s:#EEF0FF; --pay:#E5484D; --pay-s:#FFF0F0; --ok:#12A150; --ok-s:#EAF8EF; --warn:#C27B0A; --warn-s:#FFF6E5;
  --r:20px; --sh:0 1px 2px rgba(14,19,37,.04),0 8px 24px rgba(14,19,37,.06);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.app{max-width:1120px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom))}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:6px 2px 14px}
.brand{white-space:nowrap;display:flex;align-items:center;gap:10px;font-weight:750;font-size:19px;letter-spacing:-.02em}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#6366F1,#4338CA);display:grid;place-items:center;color:#fff;font-size:16px;font-weight:800;box-shadow:0 4px 12px rgba(79,70,229,.35)}
.tabs{display:none;margin-left:28px;gap:4px;background:var(--card);padding:5px;border-radius:14px;box-shadow:var(--sh)}
.tabs button{padding:9px 16px;border-radius:10px;font-weight:600;font-size:14.5px;color:var(--mut)}
.tabs button.on{background:var(--ink);color:#fff}
.spacer{flex:1}
.icon-btn{width:42px;height:42px;border-radius:13px;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;color:var(--ink2)}
.add-top{display:none;height:42px;padding:0 18px;border-radius:13px;background:var(--acc);color:#fff;font-weight:650;font-size:15px;box-shadow:0 6px 16px rgba(79,70,229,.3);align-items:center;gap:8px}

/* month switch */
.month{display:flex;align-items:center;gap:2px;background:var(--card);border-radius:13px;box-shadow:var(--sh);height:42px;padding:0 4px}
.month button{width:32px;height:34px;border-radius:9px;color:var(--mut);font-size:18px}
.month button:active{background:var(--soft)}
.month span{font-weight:650;font-size:14.5px;min-width:78px;text-align:center}

/* cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.h{font-size:13px;font-weight:650;color:var(--mut);letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.h .count{background:var(--soft);color:var(--ink2);border-radius:20px;padding:1px 8px;font-size:12px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:26px 4px 10px}
.sec h2{font-size:18px;font-weight:720;letter-spacing:-.01em}
.link{color:var(--acc);font-weight:600;font-size:14.5px}

.hero{background:linear-gradient(150deg,#1B1F3B 0%,#0E1325 70%);color:#fff;border-radius:24px;padding:22px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(99,102,241,.55),transparent 70%)}
.hero .lbl{font-size:14px;color:#AEB4D0;font-weight:550}
.hero .big{font-size:44px;font-weight:780;letter-spacing:-.03em;margin:4px 0 2px}
.hero .sub{font-size:14.5px;color:#C9CDE3}
.hero .row{display:flex;gap:10px;margin-top:18px;position:relative;z-index:1}
.pill{background:rgba(255,255,255,.1);border-radius:12px;padding:8px 12px;font-size:13.5px;color:#E3E6F5}
.pill b{color:#fff}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.stat{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:15px 16px}
.stat .v{font-size:23px;font-weight:740;letter-spacing:-.02em;margin-top:6px}
.stat .k{font-size:13px;color:var(--mut);font-weight:550;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%}

/* list rows */
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.row{display:flex;align-items:center;gap:13px;padding:13px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.tap{cursor:pointer}
.row.tap:active{background:var(--soft)}
.av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:14.5px;flex:none}
.main{flex:1;min-width:0}
.t1{font-weight:640;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:13.5px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:720;font-size:16px;text-align:right}
.amt small{display:block;font-size:12.5px;color:var(--mut);font-weight:550;margin-top:1px}
.pay-btn{height:36px;padding:0 15px;border-radius:11px;background:var(--pay);color:#fff;font-weight:650;font-size:14px;flex:none;box-shadow:0 4px 10px rgba(229,72,77,.25)}
.tag{font-size:12px;font-weight:650;border-radius:8px;padding:3px 8px;white-space:nowrap}
.tag.ok{background:var(--ok-s);color:var(--ok)} .tag.pay{background:var(--pay-s);color:var(--pay)} .tag.warn{background:var(--warn-s);color:var(--warn)} .tag.mut{background:var(--soft);color:var(--mut)}
.empty{padding:26px 16px;text-align:center;color:var(--mut);font-size:14.5px}
.empty .e{font-size:30px;margin-bottom:6px}

.problems{background:var(--warn-s);border-radius:var(--r);padding:14px 16px;margin-top:12px}
.problems .pt{font-weight:700;color:var(--warn);font-size:14.5px;display:flex;gap:8px;align-items:center}
.problems .pi{font-size:14px;color:#7A4D06;margin-top:8px;display:flex;gap:8px;cursor:pointer}
.problems .pi:before{content:"•";color:var(--warn)}

/* search */
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:0 16px;height:52px}
.search input{flex:1;border:0;outline:0;background:none;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 14px;border-radius:20px;background:var(--card);box-shadow:var(--sh);font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap}
.chip.on{background:var(--ink);color:#fff}

/* page header */
.back{display:flex;align-items:center;gap:8px;color:var(--acc);font-weight:600;font-size:15px;padding:6px 2px 14px}
.ph{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.ph .av{width:58px;height:58px;border-radius:19px;font-size:20px}
.ph h1{font-size:25px;font-weight:760;letter-spacing:-.02em}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini .stat .v{font-size:19px}
.grp{font-size:13px;font-weight:650;color:var(--mut);padding:16px 6px 8px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:8px 8px max(10px, env(safe-area-inset-bottom));z-index:20}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--mut);width:64px}
.nav button.on{color:var(--ink)}
.nav .fab{width:56px;height:56px;border-radius:18px;background:var(--acc);color:#fff;display:grid;place-items:center;margin-top:-26px;box-shadow:0 10px 22px rgba(79,70,229,.4)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(14,19,37,.42);opacity:0;pointer-events:none;transition:opacity .22s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:26px 26px 0 0;max-height:92vh;overflow:auto;transform:translateY(105%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s;z-index:50;padding:10px 20px calc(22px + env(safe-area-inset-bottom))}
.sheet.on{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-size:21px;font-weight:760;letter-spacing:-.02em;margin-bottom:4px}
.sheet .lead{color:var(--mut);font-size:14.5px;margin-bottom:16px}
.seg{display:flex;background:var(--soft);border-radius:13px;padding:4px;gap:4px;margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;padding:9px 10px;border-radius:10px;font-size:14px;font-weight:620;color:var(--mut);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(14,19,37,.1)}
.f{margin-bottom:14px;position:relative}
.f label{display:block;font-size:13px;font-weight:650;color:var(--ink2);margin-bottom:7px}
.inp{width:100%;height:52px;border-radius:14px;border:1.5px solid var(--line);background:#FBFBFD;padding:0 15px;font-size:16.5px;outline:0;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-s);background:#fff}
textarea.inp{height:76px;padding:12px 15px;resize:none}
.sug{position:absolute;left:0;right:0;top:82px;background:#fff;border-radius:14px;box-shadow:0 12px 32px rgba(14,19,37,.16);z-index:5;overflow:hidden;max-height:260px;overflow-y:auto}
.sug button{display:flex;width:100%;align-items:center;gap:12px;padding:11px 14px;text-align:left;border-top:1px solid var(--line)}
.sug button:first-child{border-top:0}
.sug button:hover,.sug button.hl{background:var(--soft)}
.sug .av{width:34px;height:34px;border-radius:11px;font-size:12.5px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);font-weight:600;font-size:14.5px;background:#fff}
.opt.on{border-color:var(--acc);background:var(--acc-s);color:var(--acc)}
.opt small{color:var(--mut);font-weight:550;margin-left:4px}
.opt.on small{color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toggle{display:flex;align-items:center;justify-content:space-between;height:52px;border-radius:14px;border:1.5px solid var(--line);padding:0 8px 0 15px;font-weight:600;font-size:15px}
.sw{width:50px;height:30px;border-radius:15px;background:#D5D8E3;position:relative;transition:background .2s}
.sw:after{content:"";position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--ok)} .sw.on:after{left:23px}
.preview{border-radius:16px;background:var(--soft);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;margin:4px 0 16px}
.preview .pv{font-size:26px;font-weight:780;letter-spacing:-.02em}
.preview .pl{font-size:13.5px;color:var(--mut)}
.btn{width:100%;height:54px;border-radius:15px;background:var(--acc);color:#fff;font-weight:700;font-size:16.5px;box-shadow:0 8px 20px rgba(79,70,229,.3)}
.btn:disabled{background:#C7CAD9;box-shadow:none}
.btn.red{background:var(--pay);box-shadow:0 8px 20px rgba(229,72,77,.3)}
.btn.ghost{background:var(--soft);color:var(--ink);box-shadow:none;margin-top:10px}
.hint{font-size:13px;color:var(--mut);margin-top:-6px;margin-bottom:12px}
.err{color:var(--pay);font-size:13.5px;font-weight:600;margin:-4px 0 12px}

.check{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line);cursor:pointer}
.check:first-of-type{border-top:0}
.box{width:24px;height:24px;border-radius:8px;border:2px solid #C8CCDA;display:grid;place-items:center;flex:none;color:#fff}
.box.on{background:var(--ok);border-color:var(--ok)}

.toast{position:fixed;left:16px;right:16px;margin:0 auto;width:fit-content;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateY(30px);background:var(--ink);color:#fff;border-radius:16px;padding:13px 16px;font-size:14.5px;font-weight:550;display:flex;align-items:center;gap:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:60;max-width:92vw;box-shadow:0 12px 28px rgba(14,19,37,.3)}
.toast.on{opacity:1;transform:none;pointer-events:auto}
.toast button{color:#A5B4FC;font-weight:700}

.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#818CF8,#4F46E5)}
.client{margin-bottom:14px}
.client .top2{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.client .nm{font-size:18px;font-weight:740}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.kv div{background:var(--soft);border-radius:12px;padding:10px 12px}
.kv b{display:block;font-size:16px;font-weight:720}
.kv span{font-size:12.5px;color:var(--mut);font-weight:550}
.site{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.site:first-of-type{border-top:0}
.people{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.people span{background:var(--soft);border-radius:8px;padding:4px 9px;font-size:13px;font-weight:550;color:var(--ink2);cursor:pointer}
.settings .row{cursor:pointer}
.demo{font-size:12.5px;color:var(--mut);text-align:center;margin-top:28px}

@media (max-width:420px){.brand .bt{display:none}}
@media (min-width:900px){
  .app{padding:24px 32px 60px}
  .tabs,.add-top{display:flex}
  .nav{display:none}
  .home{display:grid;grid-template-columns:1.05fr 1fr;gap:22px;align-items:start}
  .stats{grid-template-columns:repeat(4,1fr)}
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:520px;border-radius:24px;transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;transition:all .22s;padding:24px 26px}
  .sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto;visibility:visible}
  .grab{display:none}
  .toast{bottom:32px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="nav" id="nav"></nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
/* ============ data layer ============ */
const TABLES=["clients","sites","workers","rates","entries","income"];
const isGAS = typeof google!=="undefined" && google.script && google.script.run;
let SHEET_URL="";
let DB={clients:[],sites:[],workers:[],rates:[],entries:[],income:[]};
const KEY="crewwages_v2";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function gas(fn,...args){return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args))}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
async function load(){
  if(isGAS){const r=await gas("getAll");SHEET_URL=r.sheetUrl;delete r.sheetUrl;DB=r;return}
  try{const s=localStorage.getItem(KEY); if(s){DB=JSON.parse(s);return}}catch(e){}
  DB={clients:[],sites:[],workers:[],rates:[],entries:[],income:[]}; saveLocal();
}
async function put(table,row){ // insert or update
  const arr=DB[table]; const i=arr.findIndex(r=>r.id===row.id);
  if(i>=0)arr[i]=row; else arr.push(row);
  if(isGAS){try{await gas("upsert",table,row)}catch(e){toast("Couldn't save — check internet")}} else saveLocal();
}
async function del(table,id){
  DB[table]=DB[table].filter(r=>r.id!==id);
  if(isGAS){try{await gas("remove",table,id)}catch(e){toast("Couldn't save — check internet")}} else saveLocal();
}
async function putMany(table,rows){
  for(const row of rows){const i=DB[table].findIndex(r=>r.id===row.id); if(i>=0)DB[table][i]=row; else DB[table].push(row)}
  if(isGAS){try{await gas("upsertMany",table,rows)}catch(e){toast("Couldn't save — check internet")}} else saveLocal();
}

function seed(){
  const d={clients:[],sites:[],workers:[],rates:[],entries:[],income:[]};
  const ken={id:"c1",name:"Ken"}, bupa={id:"c2",name:"Bupa"}; d.clients.push(ken,bupa);
  const siteNames=["Marrickville","N Ryde","NRMA","Chatswood","St Ives","Tavern","Edmonton Park","Liverpool","Hornsby","Mascot","Townhall","Blacktown","Greystanes"];
  siteNames.forEach((n,i)=>d.sites.push({id:"s"+i,name:n,clientId:"c1"}));
  d.sites.push({id:"s13",name:"Bupa Parramatta",clientId:"c2"});
  const S=n=>d.sites.find(s=>s.name===n).id;
  const W=[["Akash","Marrickville",22],["Anish","N Ryde",22],["Anish","NRMA",25],["Anish","Chatswood",20],["Anish","St Ives",25],["Ankit Sharma","Tavern",25],["Ankit Sharma","Marrickville",25],
  ["Bhawana","Edmonton Park",22],["Bhawana","Liverpool",25],["Binita","Hornsby",25],["Bishal Pradhan","Mascot",22],["Bishal Pradhan","Marrickville",25],["Gugun","Tavern",23],["Kiran Ghimire","Tavern",22],
  ["Pradeep","Townhall",20],["Rajesh","N Ryde",30],["Roshan","Blacktown",25],["Roshan","Greystanes",25],["Selisha","Mascot",22],["Sam Lee","Bupa Parramatta",26]];
  W.forEach(([n,s,r])=>{let w=d.workers.find(x=>x.name===n); if(!w){w={id:"w"+d.workers.length,name:n,active:true};d.workers.push(w)} d.rates.push({id:uid(),workerId:w.id,siteId:S(s),rate:r})});
  const months=["2026-08","2026-09","2026-10","2026-11"];
  const H={"Akash":[28,30,26,24],"Anish":[57,50,52,40],"Ankit Sharma":[68,60,64,38],"Binita":[19,20,18,16],"Bishal Pradhan":[41,44,40,36],"Gugun":[20,22,18,20],"Kiran Ghimire":[56,40,48,40],"Pradeep":[98,90,94,76],"Roshan":[19,24,20,22],"Selisha":[76,70,72,60],"Sam Lee":[0,30,32,28]};
  months.forEach((m,mi)=>{
    d.rates.forEach((r,ri)=>{
      const w=d.workers.find(x=>x.id===r.workerId); const h=(H[w.name]||[])[mi]; if(!h)return;
      const same=d.rates.filter(x=>x.workerId===w.id); const k=same.indexOf(r); const hh=same.length>1?(k===0?Math.round(h*.6):Math.round(h*.4)):h;
      if(!hh)return;
      const paid = mi<2 || (mi===2 && !["Bishal Pradhan","Selisha"].includes(w.name)) || (mi===3 && ["Akash","Gugun","Binita","Roshan","Pradeep","Ankit Sharma"].includes(w.name));
      d.entries.push({id:uid(),month:m,workerId:w.id,siteId:r.siteId,hours:hh,rate:r.rate,paid,paidAt:paid?m+"-28":"",notes:"",createdAt:m+"-25"});
    });
    d.income.push({id:uid(),clientId:"c1",month:m,amount:[36000,34000,35500,30000][mi],note:""});
    if(mi>0)d.income.push({id:uid(),clientId:"c2",month:m,amount:[0,1500,1600,1400][mi],note:""});
  });
  // a couple of mistakes for the problem checker
  const k=d.workers.find(x=>x.name==="Kiran Ghimire");
  d.entries.push({id:uid(),month:"2026-11",workerId:k.id,siteId:S("Tavern"),hours:40,rate:22,paid:false,paidAt:"",notes:"",createdAt:"2026-11-26"});
  const md={id:"w"+d.workers.length,name:"MD",active:true}; d.workers.push(md);
  d.entries.push({id:uid(),month:"2026-11",workerId:md.id,siteId:S("Chatswood"),hours:12,rate:0,paid:false,paidAt:"",notes:"",createdAt:"2026-11-26"});
  return d;
}

/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=v=>"$"+(Math.round(v*100)/100).toLocaleString("en-AU",{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2});
const MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const mLabel=m=>{const[y,mm]=m.split("-");return MN[+mm-1]+" "+y};
const mShort=m=>{const[y,mm]=m.split("-");return MN[+mm-1]};
const addM=(m,n)=>{let[y,mm]=m.split("-").map(Number);mm+=n;while(mm>12){mm-=12;y++}while(mm<1){mm+=12;y--}return y+"-"+String(mm).padStart(2,"0")};
const nowM=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};

const avc=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))>>>0;return PAL[h%PAL.length]};

/* ============ calculations ============ */
function owedByWorker(){ // all months
  const map={};
  DB.entries.filter(e=>!e.paid && e.hours>0 && e.rate>0).forEach(e=>{
    const o=map[e.workerId]||(map[e.workerId]={workerId:e.workerId,amount:0,entries:[],months:new Set(),sites:new Set()});
    o.amount+=wage(e);o.entries.push(e);o.months.add(e.month);o.sites.add(Sx(e.siteId).name);
  });
  return Object.values(map).sort((a,b)=>b.amount-a.amount);
}
function monthStats(m){
  const es=DB.entries.filter(e=>e.month===m);
  const hours=es.reduce((s,e)=>s+ +e.hours,0), wages=es.reduce((s,e)=>s+wage(e),0);
  const income=DB.income.filter(i=>i.month===m).reduce((s,i)=>s+ +i.amount,0);
  return {hours,wages,income,profit:income-wages,count:es.length};
}
function problems(){
  const out=[]; const seen={};
  DB.entries.forEach(e=>{
    const k=e.workerId+"|"+e.siteId+"|"+e.month;
    if(seen[k]&&seen[k].hours==e.hours) out.push({type:"dup",e,text:`${W(e.workerId).name} — ${Sx(e.siteId).name}, ${mLabel(e.month)}: entered twice`});
    seen[k]=e;
    if(!(e.rate>0)&&e.hours>0) out.push({type:"rate",e,text:`${W(e.workerId).name} — ${Sx(e.siteId).name}, ${mLabel(e.month)}: no pay rate`});
  });
  const seenT=new Set(); return out.filter(p=>!seenT.has(p.text)&&seenT.add(p.text));
}

  });

function hl(text,q){const t=esc(text); if(!q)return t; const i=text.toLowerCase().indexOf(q); if(i<0)return t; return esc(text.slice(0,i))+`<mark style="background:#FFF1B8;border-radius:3px">${esc(text.slice(i,i+q.length))}</mark>`+esc(text.slice(i+q.length))}

  <input type="file" id="restore" accept=".json" hidden onchange="restore(this.files[0])">
  <div class="sec"><h2>Workers</h2><button class="link" onclick="openAdd('worker')">+ New worker</button></div>
  <div class="list">${DB.workers.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(w=>`<div class="row tap" onclick="openPerson('${w.id}')">${av(w.name)}<div class="main"><div class="t1">${esc(w.name)}</div></div>${w.active===false?'<span class="tag mut">Left</span>':""}${ICON.chev}</div>`).join("")}</div>
  <div class="demo">${isGAS?"Saved to your Google Sheet":"Test version — data is saved on this device only"}</div>`;
}

/* ============ sheets ============ */
let sheetClose=null;
function openSheet(html,onClose){$("#sheet").innerHTML=`<div class="grab"></div>`+html;$("#sheet").classList.add("on");$("#scrim").classList.add("on");sheetClose=onClose||null;$("#sheet").scrollTop=0}
function closeSheet(){$("#sheet").classList.remove("on");$("#scrim").classList.remove("on");if(sheetClose)sheetClose()}
$("#scrim").onclick=closeSheet;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});

let toastT;
function toast(msg,undo){const t=$("#toast");t.innerHTML=`<span>${msg}</span>`+(undo?`<button id="undo">Undo</button>`:"");t.classList.add("on");if(undo)$("#undo").onclick=()=>{undo();t.classList.remove("on")};clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),undo?5500:2600)}

/* ---- Add ---- */
let F={};
function openAdd(kind="hours",ref=null){
  F={kind,month:state.month||nowM(),workerId:null,siteId:null,hours:"",paid:false,notes:"",name:"",rate:"",clientId:null,amount:"",q:""};
  if(kind==="hours"&&ref){F.workerId=ref;const rs=DB.rates.filter(r=>r.workerId===ref);if(rs.length===1)F.siteId=rs[0].siteId;F.q=W(ref).name}
  if(kind==="worker"&&ref){F.workerId=ref;F.name=W(ref).name}
  if(kind==="money"&&ref)F.clientId=ref;
  drawAdd(); $("#sheet").classList.add("on");$("#scrim").classList.add("on");sheetClose=null;$("#sheet").scrollTop=0;
  setTimeout(()=>{const f=$("#sheet input");if(f&&kind==="hours"&&!F.workerId)f.focus()},280);
}
function drawAdd(){
  const segs=[["hours","Hours"],["worker","Worker"],["site","Site"],["client","Client"],["money","Money in"]];
  let body="";
  if(F.kind==="hours") body=formHours();
  if(F.kind==="worker") body=formWorker();
  if(F.kind==="site") body=formSite();
  if(F.kind==="client") body=formClient();
  if(F.kind==="money") body=formMoney();
  $("#sheet").innerHTML=`<div class="grab"></div><h3>Add</h3><div class="seg">${segs.map(([k,l])=>`<button class="${F.kind===k?"on":""}" onclick="F.kind='${k}';F.err='';drawAdd()">${l}</button>`).join("")}</div>${body}`;
}
function monthField(){return `<div class="f"><label>Month</label><div class="month" style="box-shadow:none;border:1.5px solid var(--line);height:52px;border-radius:14px;justify-content:space-between"><button onclick="F.month=addM(F.month,-1);drawAdd()">‹</button><span>${mLabel(F.month)}</span><button onclick="F.month=addM(F.month,1);drawAdd()">›</button></div></div>`}
function formHours(){
  const rs=F.workerId?DB.rates.filter(r=>r.workerId===F.workerId):[];
  const rate=(rs.find(r=>r.siteId===F.siteId)||{}).rate||0;
  const h=parseFloat(F.hours)||0;
  const dup=F.workerId&&F.siteId&&DB.entries.some(e=>e.workerId===F.workerId&&e.siteId===F.siteId&&e.month===F.month);
  return `${monthField()}
  <div class="f"><label>Who worked?</label><input class="inp" id="wq" placeholder="Start typing a name" value="${esc(F.q)}" autocomplete="off" oninput="F.q=this.value;F.workerId=null;F.siteId=null;sugWorkers()" onfocus="sugWorkers()"><div id="sug"></div></div>
  ${F.workerId?`<div class="f"><label>Which site?</label><div class="opts">${rs.length?rs.map(r=>`<button class="opt ${F.siteId===r.siteId?"on":""}" onclick="F.siteId='${r.siteId}';drawAdd()">${esc(Sx(r.siteId).name)}<small>${money(r.rate)}/hr</small></button>`).join(""):`<span class="t2">No site yet — <button class="link" onclick="openAdd('worker','${F.workerId}')">add one</button></span>`}</div></div>`:""}
  <div class="two">
    <div class="f"><label>Hours</label><input class="inp num" id="hrs" inputmode="decimal" placeholder="0" value="${esc(F.hours)}" oninput="F.hours=this.value.replace(/[^0-9.]/g,'');this.value=F.hours;updPreview()"></div>
    <div class="f"><label>Already paid?</label><button class="toggle" style="width:100%" onclick="F.paid=!F.paid;drawAdd()"><span>${F.paid?"Yes":"Not yet"}</span><span class="sw ${F.paid?"on":""}"></span></button></div>
  </div>
  <div class="opts" style="margin:-4px 0 14px">${[8,16,24,38,40].map(n=>`<button class="opt" style="padding:7px 12px;font-size:13.5px" onclick="F.hours='${n}';drawAdd()">${n} hrs</button>`).join("")}</div>
  <div class="f"><label>Note <span style="color:var(--mut);font-weight:500">(optional)</span></label><input class="inp" placeholder="e.g. Public holiday" value="${esc(F.notes)}" oninput="F.notes=this.value"></div>
  <div class="preview" id="pv"><div><div class="pl">${F.siteId?`${h||0} hrs × ${money(rate)}`:"Pay"}</div><div class="pv num">${money(h*rate)}</div></div><span class="tag ${F.paid?"ok":"pay"}">${F.paid?"Paid":"Goes to To pay"}</span></div>
  ${dup?`<div class="err">⚠ ${esc(W(F.workerId).name)} already has hours at this site for ${mLabel(F.month)}.</div>`:""}
  <button class="btn" ${F.workerId&&F.siteId&&h>0?"":"disabled"} onclick="saveHours()">Save hours</button>`;
}
function updPreview(){const rs=DB.rates.filter(r=>r.workerId===F.workerId);const rate=(rs.find(r=>r.siteId===F.siteId)||{}).rate||0;const h=parseFloat(F.hours)||0;
  const pv=$("#pv"); if(pv){pv.querySelector(".pl").textContent=F.siteId?`${h} hrs × ${money(rate)}`:"Pay";pv.querySelector(".pv").textContent=money(h*rate)}
  const b=$("#sheet .btn"); if(b)b.disabled=!(F.workerId&&F.siteId&&h>0)}
function sugWorkers(){
  const q=F.q.trim().toLowerCase(); const box=$("#sug"); if(!box)return;
  let ws=DB.workers.filter(w=>w.active!==false&&(!q||w.name.toLowerCase().includes(q))).slice(0,6);
  if(!ws.length){box.innerHTML=`<div class="sug"><button onclick="F.kind='worker';F.name=F.q;drawAdd()"><div class="main"><div class="t1">+ Add “${esc(F.q)}” as a new worker</div></div></button></div>`;return}
  box.innerHTML=`<div class="sug">${ws.map(w=>`<button onmousedown="event.preventDefault()" onclick="pickW('${w.id}')">${av(w.name)}<div class="main"><div class="t1">${esc(w.name)}</div><div class="t2">${DB.rates.filter(r=>r.workerId===w.id).map(r=>esc(Sx(r.siteId).name)).join(", ")}</div></div></button>`).join("")}</div>`;
}
function pickW(id){F.workerId=id;F.q=W(id).name;const rs=DB.rates.filter(r=>r.workerId===id);F.siteId=rs.length===1?rs[0].siteId:null;drawAdd();setTimeout(()=>{if(F.siteId)$("#hrs")?.focus()},50)}
async function saveHours(){
  const rate=(DB.rates.find(r=>r.workerId===F.workerId&&r.siteId===F.siteId)||{}).rate||0;
  const e={id:uid(),month:F.month,workerId:F.workerId,siteId:F.siteId,hours:parseFloat(F.hours),rate,paid:F.paid,paidAt:F.paid?new Date().toISOString().slice(0,10):"",notes:F.notes,createdAt:new Date().toISOString().slice(0,10)};
  await put("entries",e); closeSheet(); render();
  toast(`✓ Saved · ${esc(W(e.workerId).name)} · ${e.hours} hrs · ${money(wage(e))}`,async()=>{await del("entries",e.id);render()});
}
function formWorker(){
  const existing=F.workerId?W(F.workerId):null;
  return `<div class="f"><label>Name</label><input class="inp" placeholder="Full name" value="${esc(F.name)}" oninput="F.name=this.value" ${existing?"disabled":""}></div>
  <div class="f"><label>Works at</label><div class="opts">${DB.sites.length?"":`<span class="t2">No sites yet — <button class="link" onclick="F.kind='site';F.name='';drawAdd()">add a site first</button></span>`}${DB.sites.map(s=>`<button class="opt ${F.siteId===s.id?"on":""}" onclick="F.siteId='${s.id}';drawAdd()">${esc(s.name)}</button>`).join("")}</div></div>
  <div class="f"><label>Pay rate ($ per hour)</label><input class="inp num" inputmode="decimal" placeholder="e.g. 25" value="${esc(F.rate)}" oninput="F.rate=this.value"></div>
  <div class="hint">Works at more than one site? Save, then add the next site from their page.</div>
  ${F.err?`<div class="err">${F.err}</div>`:""}
  <button class="btn" onclick="saveWorker()">${existing?"Add site":"Save worker"}</button>`;
}
async function saveWorker(){
  const name=F.name.trim(), rate=parseFloat(F.rate);
  if(!name)return F.err="Type a name",drawAdd(); if(!F.siteId)return F.err="Pick a site",drawAdd(); if(!(rate>0))return F.err="Type the pay rate",drawAdd();
  let w=F.workerId?W(F.workerId):DB.workers.find(x=>x.name.toLowerCase()===name.toLowerCase());
  if(!w){w={id:uid(),name,active:true};await put("workers",w)}
  const ex=DB.rates.find(r=>r.workerId===w.id&&r.siteId===F.siteId);
  await put("rates",{id:ex?ex.id:uid(),workerId:w.id,siteId:F.siteId,rate});
  closeSheet(); render(); toast(`✓ ${esc(w.name)} · ${esc(Sx(F.siteId).name)} · ${money(rate)}/hr`);
}
function formSite(){
  return `<div class="f"><label>Site name</label><input class="inp" placeholder="e.g. Parramatta" value="${esc(F.name)}" oninput="F.name=this.value"></div>
  <div class="f"><label>Client</label><div class="opts">${DB.clients.map(c=>`<button class="opt ${F.clientId===c.id?"on":""}" onclick="F.clientId='${c.id}';drawAdd()">${esc(c.name)}</button>`).join("")}<button class="opt" onclick="F.kind='client';drawAdd()">+ New client</button></div></div>
  ${F.err?`<div class="err">${F.err}</div>`:""}<button class="btn" onclick="saveSite()">Save site</button>`;
}
async function saveSite(){
  const name=F.name.trim(); if(!name)return F.err="Type a site name",drawAdd(); if(!F.clientId)return F.err="Pick a client",drawAdd();
  if(DB.sites.some(s=>s.name.toLowerCase()===name.toLowerCase()))return F.err="That site already exists",drawAdd();
  await put("sites",{id:uid(),name,clientId:F.clientId}); closeSheet(); render(); toast(`✓ Site added · ${esc(name)}`);
}
function formClient(){
  return `<div class="f"><label>Client name</label><input class="inp" placeholder="e.g. Bupa" value="${esc(F.name)}" oninput="F.name=this.value"></div>
  ${F.err?`<div class="err">${F.err}</div>`:""}<button class="btn" onclick="saveClient()">Save client</button>`;
}
async function saveClient(){
  const name=F.name.trim(); if(!name)return F.err="Type a name",drawAdd();
  if(DB.clients.some(c=>c.name.toLowerCase()===name.toLowerCase()))return F.err="That client already exists",drawAdd();
  const c={id:uid(),name}; await put("clients",c); F={...F,kind:"site",clientId:c.id,name:"",err:""}; drawAdd(); toast(`✓ Client added · ${esc(name)} — now add a site`);
}
function formMoney(){
  return `${monthField()}<div class="f"><label>From client</label><div class="opts">${DB.clients.map(c=>`<button class="opt ${F.clientId===c.id?"on":""}" onclick="F.clientId='${c.id}';drawAdd()">${esc(c.name)}</button>`).join("")}</div></div>
  <div class="f"><label>Amount ($)</label><input class="inp num" inputmode="decimal" placeholder="0" value="${esc(F.amount)}" oninput="F.amount=this.value"></div>
  ${F.err?`<div class="err">${F.err}</div>`:""}<button class="btn" onclick="saveMoney()">Save money in</button>`;
}
async function saveMoney(){
  const a=parseFloat(F.amount); if(!F.clientId)return F.err="Pick a client",drawAdd(); if(!(a>0))return F.err="Type the amount",drawAdd();
  await put("income",{id:uid(),clientId:F.clientId,month:F.month,amount:a,note:""}); closeSheet(); render(); toast(`✓ ${money(a)} from ${esc(C(F.clientId).name)} · ${mLabel(F.month)}`);
}

/* ---- Pay ---- */
let P={};
function openPay(wid){
  const es=DB.entries.filter(e=>e.workerId===wid&&!e.paid&&e.hours>0&&e.rate>0).sort((a,b)=>a.month.localeCompare(b.month));
  P={wid,sel:new Set(es.map(e=>e.id)),es}; drawPay(); $("#sheet").classList.add("on");$("#scrim").classList.add("on");sheetClose=null;
}
function drawPay(){
  const w=W(P.wid); const tot=P.es.filter(e=>P.sel.has(e.id)).reduce((s,e)=>s+wage(e),0);
  $("#sheet").innerHTML=`<div class="grab"></div>
  <div style="display:flex;gap:14px;align-items:center;margin-bottom:12px">${av(w.name)}<div><h3 style="margin:0">Pay ${esc(w.name)}</h3><div class="t2">Tick what you're paying now</div></div></div>
  <div style="margin-bottom:16px">${P.es.map(e=>`<div class="check" onclick="P.sel.has('${e.id}')?P.sel.delete('${e.id}'):P.sel.add('${e.id}');drawPay()"><div class="box ${P.sel.has(e.id)?"on":""}">${P.sel.has(e.id)?ICON.check:""}</div><div class="main"><div class="t1">${esc(Sx(e.siteId).name)} · ${mLabel(e.month)}</div><div class="t2">${e.hours} hrs × ${money(e.rate)}</div></div><div class="amt num">${money(wage(e))}</div></div>`).join("")}</div>
  <button class="btn red" ${P.sel.size?"":"disabled"} onclick="doPay()">Mark ${money(tot)} as paid</button>
  <button class="btn ghost" onclick="closeSheet()">Cancel</button>`;
}
async function doPay(){
  const today=new Date().toISOString().slice(0,10);
  const rows=P.es.filter(e=>P.sel.has(e.id)).map(e=>({...e,paid:true,paidAt:today}));
  const before=P.es.filter(e=>P.sel.has(e.id)).map(e=>({...e}));
  const tot=rows.reduce((s,e)=>s+wage(e),0), name=W(P.wid).name;
  await putMany("entries",rows); closeSheet(); render();
  toast(`✓ ${esc(name)} paid ${money(tot)}`,async()=>{await putMany("entries",before);render()});
}

/* ---- Edit entry ---- */
function openEntry(id){
  const e=DB.entries.find(x=>x.id===id); if(!e)return;
  F={kind:"edit",e:{...e}};
  const draw=()=>{const x=F.e;$("#sheet").innerHTML=`<div class="grab"></div><h3>${esc(W(x.workerId).name)}</h3><div class="lead">${esc(Sx(x.siteId).name)} · ${mLabel(x.month)}</div>
    <div class="two"><div class="f"><label>Hours</label><input class="inp num" inputmode="decimal" value="${x.hours}" oninput="F.e.hours=parseFloat(this.value)||0"></div>
    <div class="f"><label>Rate ($/hr)</label><input class="inp num" inputmode="decimal" value="${x.rate}" oninput="F.e.rate=parseFloat(this.value)||0"></div></div>
    <div class="f"><label>Paid?</label><button class="toggle" style="width:100%" id="pt"><span>${x.paid?"Paid":"Not yet"}</span><span class="sw ${x.paid?"on":""}"></span></button></div>
    <div class="f"><label>Note</label><input class="inp" value="${esc(x.notes)}" oninput="F.e.notes=this.value"></div>
    <button class="btn" id="sv">Save changes</button><button class="btn ghost" id="dl" style="color:var(--pay)">Delete this entry</button>`;
    $("#pt").onclick=()=>{F.e.paid=!F.e.paid;F.e.paidAt=F.e.paid?new Date().toISOString().slice(0,10):"";draw()};
    $("#sv").onclick=async()=>{await put("entries",F.e);closeSheet();render();toast("✓ Changes saved")};
    $("#dl").onclick=async()=>{const old={...e};await del("entries",e.id);closeSheet();render();toast("Entry deleted",async()=>{await put("entries",old);render()})};
  };
  draw(); $("#sheet").classList.add("on");$("#scrim").classList.add("on");sheetClose=null;
}

/* ---- export / backup ---- */
function download(name,text,type){if(!isGAS&&location.hostname.includes("claude")){toast("Downloads work in the real app");throw 0}const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function exportCSV(){try{exportCSV_()}catch(e){}}
function exportCSV_(){
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const rows=[["Month","Name","Site","Client","Hours","Rate","Wages","Paid","Paid on","Note"]].concat(
    DB.entries.slice().sort((a,b)=>a.month.localeCompare(b.month)||W(a.workerId).name.localeCompare(W(b.workerId).name))
    .map(e=>[mLabel(e.month),W(e.workerId).name,Sx(e.siteId).name,C(Sx(e.siteId).clientId).name,e.hours,e.rate,wage(e),e.paid?"Yes":"No",e.paidAt,e.notes]));
  download("Crew_Wages_hours.csv","﻿"+rows.map(r=>r.map(q).join(",")).join("\r\n"),"text/csv");toast("✓ Downloaded — opens in Excel");
}
function backup(){try{download(`Crew_Wages_backup_${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(DB),"application/json");toast("✓ Backup downloaded")}catch(e){}}
function restore(file){if(!file)return;const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result);if(!TABLES.every(t=>Array.isArray(d[t])))throw 0;
  if(!confirmBox("Replace everything with this backup?"))return; DB=d; if(isGAS)await gas("replaceAll",DB); else saveLocal(); render(); toast("✓ Backup restored")}catch(e){toast("That file isn't a Crew Wages backup")}};r.readAsText(file)}
function confirmBox(m){try{return window.confirm(m)}catch(e){return true}}
function resetDemo(sample){if(!confirmBox(sample?"Replace everything with sample data?":"Delete all data on this device?"))return;DB=sample?seed():{clients:[],sites:[],workers:[],rates:[],entries:[],income:[]};saveLocal();state.person=null;if(sample)state.month="2026-11";go("home");toast(sample?"Sample data loaded":"All data cleared")}

/* ============ start ============ */
(async()=>{
  $("#app").innerHTML=`<div class="empty" style="padding-top:40vh">Loading…</div>`;
  try{await load()}catch(e){$("#app").innerHTML=`<div class="empty" style="padding-top:35vh">Couldn't load your data.<br>Check the internet and refresh.</div>`;return}
  const ms=DB.entries.map(e=>e.month).sort(); state.month=isGAS?nowM():(ms[ms.length-1]||nowM());
  render();
})();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
