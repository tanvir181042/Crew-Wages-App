<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Crew Wages</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Crew Wages">
<style>
:root{
  --bg:#F2F2F7; --grp:#FFFFFF; --modal:#F2F2F7; --label:#000000; --label2:#6C6C70; --label3:#AEAEB2; --sep:#C6C6C8; --fill:#E9E9EE; --press:#D1D1D6;
  --tint:#5856D6; --tint-s:rgba(88,86,214,.12);
  --red:#D70015; --red-f:#FF3B30; --red-s:rgba(255,59,48,.12);
  --green:#248A3D; --green-f:#34C759; --green-s:rgba(52,199,89,.14);
  --orange:#C93400; --orange-f:#FF9500; --orange-s:rgba(255,149,0,.14);
  --bar:rgba(249,249,249,.86); --chev:#C4C4C7;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Inter,Roboto,Arial,sans-serif;
  --ease:cubic-bezier(.32,.72,0,1);
  --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#000000;--grp:#1C1C1E;--modal:#1C1C1E;--label:#FFFFFF;--label2:#98989F;--label3:#5A5A5F;--sep:#38383A;--fill:#2C2C2E;--press:#3A3A3C;
    --tint:#7D7AFF;--tint-s:rgba(125,122,255,.18);--red:#FF6961;--red-f:#FF453A;--red-s:rgba(255,69,58,.18);--green:#30DB5B;--green-f:#30D158;--green-s:rgba(48,209,88,.18);
    --orange:#FFB340;--orange-f:#FF9F0A;--orange-s:rgba(255,159,10,.18);--bar:rgba(22,22,24,.82);--chev:#5A5A5F}
  .modal .grp{background:#2C2C2E}
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--label);font-family:var(--font);font-size:17px;letter-spacing:-.41px;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit;border:0;background:none;outline:0}
button{cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
input,textarea{-webkit-user-select:text;user-select:text}
.num{font-variant-numeric:tabular-nums}
svg{display:block;flex:none}

/* ---------- app frame ---------- */
#app{position:fixed;inset:0;max-width:680px;margin:0 auto;overflow:hidden}
@media (min-width:700px){#app{box-shadow:0 0 0 1px var(--sep)}}
#stack{position:absolute;inset:0;bottom:calc(50px + var(--sb))}
.scr{position:absolute;inset:0;background:var(--bg);will-change:transform}
.scr.under{pointer-events:none}
.shade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:5}
.sc{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:calc(var(--st) + 44px) 0 32px}

/* nav bar */
.nb{position:absolute;left:0;right:0;top:0;height:calc(var(--st) + 44px);padding-top:var(--st);display:flex;align-items:center;z-index:4;transition:background .2s,box-shadow .2s}
.scr.scrolled .nb,.nb.solid{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}
.nb-l,.nb-r{flex:1;display:flex;align-items:center;min-width:0}
.nb-r{justify-content:flex-end;padding-right:8px;gap:4px}
.nb-l{padding-left:8px}
.nb-t{flex:0 1 auto;max-width:55%;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .15s}
.scr.scrolled .nb-t,.nb.solid .nb-t{opacity:1}
.nbb{height:44px;min-width:44px;padding:0 8px;display:flex;align-items:center;justify-content:center;gap:2px;color:var(--tint);font-size:17px}
.nbb:active{opacity:.35}
.nbb.bold{font-weight:600}
.nbb:disabled{color:var(--label3)}
.lt{font-size:34px;font-weight:700;letter-spacing:.37px;line-height:41px;padding:2px 16px 8px}

/* grouped lists */
.sec{margin:0 16px 22px}
.gh{font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:-.08px;padding:0 16px 7px;line-height:18px}
.gh.big{font-size:22px;font-weight:700;color:var(--label);text-transform:none;letter-spacing:.35px;padding:0 4px 8px;display:flex;justify-content:space-between;align-items:baseline}
.gh.big small{font-size:15px;font-weight:400;color:var(--label2);letter-spacing:-.24px}
.gf{font-size:13px;color:var(--label2);padding:7px 16px 0;line-height:18px;letter-spacing:-.08px}
.gf.err{color:var(--red)}
.grp{background:var(--grp);border-radius:10px;overflow:hidden}
.cell{position:relative;display:flex;align-items:center;gap:12px;min-height:44px;padding:0 16px;width:100%;text-align:left}
.cell+.cell:before,.cell+.sugbox:before,.sugbox .cell:before{content:"";position:absolute;top:0;right:0;left:var(--inset,16px);height:.5px;background:var(--sep)}
.sugbox .cell:first-child:before{left:16px}
.cell.av-row{--inset:68px;min-height:60px;padding-top:8px;padding-bottom:8px}
button.cell:active,.cell.tap:active{background:var(--press)}
.cell .ct{flex:1;min-width:0;padding:11px 0}
.cell.av-row .ct{padding:0}
.t1{font-size:17px;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:15px;line-height:20px;color:var(--label2);letter-spacing:-.24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv{color:var(--label2);white-space:nowrap;text-align:right}
.chev{width:8px;height:13px;color:var(--chev);margin-left:-2px}
.blue{color:var(--tint)}
.red{color:var(--red)}
.green{color:var(--green)}
.cell.action{color:var(--tint)}
.cell.danger{color:var(--red);justify-content:center}
.ic{width:29px;height:29px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:15px;letter-spacing:0;flex:none;color:#fff}
.amt{font-weight:600;white-space:nowrap}
.pill{font-size:12px;font-weight:600;border-radius:6px;padding:2px 7px;white-space:nowrap;letter-spacing:0}
.pill.r{background:var(--red-s);color:var(--red)}.pill.g{background:var(--green-s);color:var(--green)}.pill.o{background:var(--orange-s);color:var(--orange)}.pill.n{background:var(--fill);color:var(--label2)}
.capsule{height:30px;padding:0 14px;border-radius:15px;font-size:15px;font-weight:600;letter-spacing:-.24px;white-space:nowrap;flex:none}
.capsule.red{background:var(--red-s);color:var(--red)}
.capsule:active{opacity:.5}
mark{background:rgba(255,204,0,.35);color:inherit;border-radius:3px}

/* summary card */
.sum{padding:16px}
.sum .cap{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:-.08px;display:flex;justify-content:space-between;align-items:center}
.sum .big{font-size:40px;font-weight:700;letter-spacing:.2px;line-height:1.15;margin-top:4px}
.sum .sub{font-size:15px;color:var(--label2);letter-spacing:-.24px}
.grid2{display:grid;grid-template-columns:1fr 1fr}
.grid2>div{padding:12px 16px;position:relative}
.grid2>div:nth-child(odd):after{content:"";position:absolute;right:0;top:12px;bottom:12px;width:.5px;background:var(--sep)}
.grid2>div:nth-child(n+3):before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
.grid2>div:nth-child(4):before{left:0;right:16px}
.grid2 .k{font-size:13px;color:var(--label2);letter-spacing:-.08px}
.grid2 .v{font-size:22px;font-weight:600;letter-spacing:.35px;margin-top:2px}
.mstep{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 4px}
.mstep b{font-size:17px;font-weight:600}
.mstep button{width:44px;height:44px;display:grid;place-items:center;color:var(--tint)}
.mstep button:active{opacity:.35}
.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin:2px 16px 14px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--tint)}

/* search + segmented */
.search{margin:0 16px 10px;height:36px;border-radius:10px;background:var(--fill);display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--label2)}
.search input{flex:1;min-width:0;height:36px;font-size:17px;-webkit-appearance:none;appearance:none;color:var(--label)}
.search input::placeholder{color:var(--label2)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.seg{margin:0 16px 16px;display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;height:28px;border-radius:7px;font-size:13px;font-weight:500;letter-spacing:-.08px}
.seg button.on{background:var(--grp);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}
@media (prefers-color-scheme:dark){.seg button.on{background:#636366}}

/* person header */
.phead{text-align:center;padding:4px 16px 18px}
.phead .av{width:84px;height:84px;font-size:32px;margin:0 auto 10px}
.phead h1{font-size:28px;font-weight:700;letter-spacing:.36px;line-height:34px}
.phead .t2{white-space:normal}
.acts{display:flex;gap:8px;margin:0 16px 22px}
.acts button{flex:1;background:var(--grp);border-radius:10px;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--tint);font-size:12px;font-weight:500;letter-spacing:0}
.acts button:active{background:var(--press)}
.acts button:disabled{color:var(--label3)}
.acts button.r{color:var(--red)}
.acts button.r:disabled{color:var(--label3)}

/* empty */
.empty{text-align:center;color:var(--label2);padding:28px 16px;font-size:15px;letter-spacing:-.24px}
.empty svg{margin:0 auto 8px;color:var(--label3)}
.hero{margin:6px 16px 22px;padding:28px 20px;border-radius:14px;background:linear-gradient(140deg,#6E6BE8,#4A47C9);color:#fff;text-align:center}
.hero .logo{width:64px;height:64px;border-radius:15px;background:rgba(255,255,255,.18);display:grid;place-items:center;margin:0 auto 14px;font-size:30px;font-weight:700}
.hero h2{font-size:28px;font-weight:700;letter-spacing:.36px}
.hero p{font-size:15px;opacity:.85;margin-top:4px;letter-spacing:-.24px}
.stepn{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:600;flex:none;background:var(--tint-s);color:var(--tint)}
.stepn.done{background:var(--green-f);color:#fff}

/* tab bar */
#tabbar{position:absolute;left:0;right:0;bottom:0;height:calc(50px + var(--sb));padding-bottom:var(--sb);display:flex;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--sep);z-index:20}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;gap:2px;font-size:10px;font-weight:500;letter-spacing:.1px;color:#8E8E93}
#tabbar button.on{color:var(--tint)}
html.ios-app #tabbar{height:calc(54px + max(var(--sb),20px));padding-bottom:max(var(--sb),20px)}
html.ios-app #stack{bottom:calc(54px + max(var(--sb),20px))}

/* modal page sheet */
#scrim{position:fixed;left:0;right:0;bottom:0;top:var(--st);background:rgba(0,0,0,.4);opacity:0;visibility:hidden;transition:opacity .35s var(--ease),visibility 0s .35s;z-index:40}
#scrim.on{opacity:1;visibility:visible;transition:opacity .35s var(--ease)}
.modal{position:fixed;left:0;right:0;margin:0 auto;max-width:680px;top:calc(var(--st) + 10px);bottom:var(--kb,0px);background:var(--modal);border-radius:12px 12px 0 0;z-index:50;display:flex;flex-direction:column;transform:translateY(105%);visibility:hidden;transition:transform .45s var(--ease),visibility 0s .45s;box-shadow:0 -1px 0 rgba(0,0,0,.04)}
.modal.on{transform:none;visibility:visible;transition:transform .45s var(--ease)}
.modal.on2{z-index:52}
.mh{display:flex;align-items:center;height:56px;padding:6px 8px 0;flex:none;position:relative}
.mh:before{content:"";position:absolute;top:5px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:var(--label3);opacity:.5}
.mh .nb-t{opacity:1}
.mb{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:10px 0 calc(24px + var(--sb))}
.inp{flex:1;min-width:0;height:44px;font-size:17px;color:var(--label)}
.inp::placeholder{color:var(--label3)}
.inp.r{text-align:right}
textarea.inp{height:88px;padding:11px 0;resize:none;font-size:16px}
.sw{width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;transition:background .25s;flex:none}
.sw:after{content:"";position:absolute;width:27px;height:27px;border-radius:50%;background:#fff;top:2px;left:2px;transition:transform .25s var(--ease);box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16)}
.sw.on{background:var(--green-f)}.sw.on:after{transform:translateX(20px)}
.chips{display:flex;gap:8px;padding:8px 16px 12px;flex-wrap:wrap}
.chips button{height:32px;padding:0 14px;border-radius:16px;background:var(--tint-s);color:var(--tint);font-size:15px;font-weight:500;letter-spacing:-.24px}
.chips button:active{opacity:.5}
.check{color:var(--tint);width:20px;flex:none}
.circ{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--label3);display:grid;place-items:center;flex:none;color:#fff}
.circ.on{background:var(--tint);border-color:var(--tint)}
.bigbtn{display:block;width:calc(100% - 32px);margin:0 16px;height:50px;border-radius:12px;background:var(--tint);color:#fff;font-size:17px;font-weight:600}
.bigbtn.red{background:var(--red-f)}
.bigbtn:active{opacity:.7}
.bigbtn:disabled{background:var(--fill);color:var(--label3)}

/* action sheet */
#as{position:fixed;inset:0;z-index:70;visibility:hidden}
#as.on{visibility:visible}
#as .bk{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:opacity .3s}
#as.on .bk{opacity:1}
#as .box{position:absolute;left:8px;right:8px;bottom:calc(8px + var(--sb));max-width:560px;margin:0 auto;transform:translateY(120%);transition:transform .4s var(--ease)}
#as.on .box{transform:none}
#as .g{background:var(--bar);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-radius:14px;overflow:hidden;margin-bottom:8px}
@media (prefers-color-scheme:light){#as .g{background:rgba(255,255,255,.92)}}
#as .hd{padding:14px 16px;text-align:center;font-size:13px;color:var(--label2);letter-spacing:-.08px}
#as .hd b{display:block;font-weight:600;margin-bottom:2px}
#as .g button{display:block;width:100%;height:57px;font-size:20px;color:var(--tint);letter-spacing:.38px;border-top:.5px solid var(--sep)}
#as .g button:first-child:not(.after-hd){border-top:0}
#as .g button.d{color:var(--red-f)}
#as .g button.c{font-weight:600}
#as .g button:active{background:var(--press)}

/* banner (top HUD) */
#banner{position:fixed;left:12px;right:12px;top:calc(var(--st) + 6px);max-width:440px;margin:0 auto;z-index:80;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:flex;align-items:center;gap:10px;padding:12px 14px;font-size:15px;font-weight:500;letter-spacing:-.24px;transform:translateY(-140%);transition:transform .45s var(--ease);pointer-events:none}
@media (prefers-color-scheme:light){#banner{background:rgba(255,255,255,.94)}}
#banner.on{transform:none;pointer-events:auto}
#banner .bt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#banner button{color:var(--tint);font-weight:600}
#banner .bi{color:var(--green-f)}

/* sync dot */
.syncb{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--label2);text-transform:none;letter-spacing:-.08px}
.syncb i{width:7px;height:7px;border-radius:50%;display:inline-block}

/* lock */
.lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:grid;place-items:center;padding:var(--st) 20px var(--sb)}
.lk-in{text-align:center;width:100%;max-width:320px}
.lk-logo{width:60px;height:60px;border-radius:14px;margin:0 auto 18px;background:linear-gradient(140deg,#6E6BE8,#4A47C9);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:700}
.lk-t{font-size:22px;font-weight:600;letter-spacing:.35px}.lk-s{color:var(--label2);font-size:15px;margin-top:4px;letter-spacing:-.24px}
.dots{display:flex;gap:22px;justify-content:center;margin:30px 0 36px}.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--label)}.dots i.on{background:var(--label)}
.dots.shake{animation:sh .4s}@keyframes sh{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,78px);gap:16px 26px;justify-content:center}
.pad button{width:78px;height:78px;border-radius:50%;background:var(--fill);font-size:34px;font-weight:400;letter-spacing:0}
.pad button.del{background:none;font-size:17px}
.pad button:active{background:var(--press)}
.lk-c{margin-top:22px;color:var(--tint);font-size:17px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:.5px solid var(--sep)}
.grid3>div{padding:12px 14px;position:relative}
.grid3>div+div:before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:.5px;background:var(--sep)}
.grid3 .k{font-size:13px;color:var(--label2);letter-spacing:-.08px}
.grid3 .v{font-size:19px;font-weight:600;margin-top:2px;white-space:nowrap}
</style>
</head>
<body>
<div id="app"><div id="stack"></div><nav id="tabbar"></nav></div>
<div id="scrim"></div>
<div class="modal" id="modal"><div class="mb"></div></div>
<div id="as"></div>
<div id="banner"></div>
<input type="file" id="restore" accept=".json" hidden onchange="restore(this.files[0]);this.value=''">
<script>
if(window.navigator.standalone===true||matchMedia("(display-mode: standalone)").matches)document.documentElement.classList.add("ios-app");
const APP_VERSION="3.0";
const TABLES=["clients","sites","workers","rates","entries","income"];
const EMPTY=()=>({clients:[],sites:[],workers:[],rates:[],entries:[],income:[]});
let DB=EMPTY();
const KEY="crewwages_v2", K_CONN="cw_conn", K_CACHE="cw_cache", K_OUT="cw_outbox", K_PIN="cw_pin";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let CONN=ls.get(K_CONN,null);            // {u: web app url, k: key, s: sheet url}
let OUT=ls.get(K_OUT,[]);                // queued changes waiting to reach the Sheet
let SYNC={state:"idle",at:null};          // idle | syncing | offline | error
const online=()=>!!CONN;
function saveLocal(){ if(online()) ls.set(K_CACHE,DB); else ls.set(KEY,DB) }

async function api(action,payload={}){
  const r=await fetch(CONN.u,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({key:CONN.k,action,...payload}),redirect:"follow"});
  const j=await r.json();
  if(!j.ok){const e=new Error(j.error||"Failed");e.server=true;throw e}
  return j.data;
}
async function load(){
  if(online()){DB=ls.get(K_CACHE,null)||EMPTY();return}
  DB=ls.get(KEY,null)||EMPTY();
}
function queue(op){OUT.push(op);ls.set(K_OUT,OUT);flush()}
let flushing=false;
async function flush(){
  if(!online()||flushing)return; flushing=true; setSync("syncing");
  try{
    while(OUT.length){
      const op=OUT[0];
      await api(op.action,op);
      OUT.shift(); ls.set(K_OUT,OUT);
    }
    setSync("idle");
  }catch(e){
    if(e.server&&/key/i.test(e.message)){setSync("error");toast("This device was disconnected from the Sheet");}
    else setSync("offline");
  }finally{flushing=false}
}
async function pull(){
  if(!online())return;
  await flush(); if(OUT.length)return;
  setSync("syncing");
  try{const d=await api("getAll"); if(d.sheetUrl){CONN.s=d.sheetUrl;ls.set(K_CONN,CONN)} delete d.sheetUrl;
      if(!OUT.length){DB=d;saveLocal();render()} setSync("idle");}

function owedByWorker(){ // all months
  const map={};
  DB.entries.filter(e=>!e.paid && e.hours>0 && e.rate>0).forEach(e=>{
    const o=map[e.workerId]||(map[e.workerId]={workerId:e.workerId,amount:0,entries:[],months:new Set(),sites:new Set()});
    o.amount+=wage(e);o.entries.push(e);o.months.add(e.month);o.sites.add(Sx(e.siteId).name);
  });
  return Object.values(map).sort((a,b)=>b.amount-a.amount);
}
function monthStats(m){
  const es=DB.entries.filter(e=>e.month===m);
  const hours=es.reduce((s,e)=>s+ +e.hours,0), wages=es.reduce((s,e)=>s+wage(e),0);
  const income=DB.income.filter(i=>i.month===m).reduce((s,i)=>s+ +i.amount,0);
  return {hours,wages,income,profit:income-wages,count:es.length};
}
function problems(){
  const out=[]; const seen={};
  DB.entries.forEach(e=>{
    const k=e.workerId+"|"+e.siteId+"|"+e.month;
    if(seen[k]&&seen[k].hours==e.hours) out.push({type:"dup",e,text:`${W(e.workerId).name} — ${Sx(e.siteId).name}, ${mLabel(e.month)}: entered twice`});
    seen[k]=e;
    if(!(e.rate>0)&&e.hours>0) out.push({type:"rate",e,text:`${W(e.workerId).name} — ${Sx(e.siteId).name}, ${mLabel(e.month)}: no pay rate`});
  });
  const seenT=new Set(); return out.filter(p=>!seenT.has(p.text)&&seenT.add(p.text));
}

const TABS=[["home","Overview",I.tabHome],["people","People",I.tabPeople],["clients","Clients",I.tabClients],["more","More",I.tabMore]];

const stacks={home:[{n:"home"}],people:[{n:"people"}],clients:[{n:"clients"}],more:[{n:"more"}]};
let animating=false;

function screenHTML(route){
  const v=VIEWS[route.n](route);
  const depth=stacks[state.tab].indexOf(route);
  const backLabel=depth>0?(TABS.find(t=>t[0]===state.tab)[1]):"";
  const left=depth>0?`<button class="nbb" onclick="pop()">${I.back}<span style="margin-left:4px">${esc(v.back||backLabel)}</span></button>`:(v.left||"");
  return `<div class="nb"><div class="nb-l">${left}</div><div class="nb-t">${esc(v.title)}</div><div class="nb-r">${v.right||""}</div></div>
  <div class="sc">${v.large===false?"":`<div class="lt">${esc(v.title)}</div>`}${v.body}</div><div class="shade"></div>`;
}
function mountScreen(route){
  const el=document.createElement("section");el.className="scr";el.innerHTML=screenHTML(route);el._route=route;
  const sc=el.querySelector(".sc");sc.addEventListener("scroll",()=>el.classList.toggle("scrolled",sc.scrollTop>(route.n==="person"||route.n==="client"?70:34)),{passive:true});
  if(VIEWS[route.n].after)setTimeout(()=>VIEWS[route.n].after(el,route));
  return el;
}
function topEl(){const s=$("#stack");return s.lastElementChild}
function render(){ // re-render current screen in place, keep scroll
  const el=topEl(); if(!el)return;
  const sc=el.querySelector(".sc"), y=sc?sc.scrollTop:0;
  el.innerHTML=screenHTML(el._route); const sc2=el.querySelector(".sc"); sc2.scrollTop=y;
  sc2.addEventListener("scroll",()=>el.classList.toggle("scrolled",sc2.scrollTop>(el._route.n==="person"||el._route.n==="client"?70:34)),{passive:true});
  el.classList.toggle("scrolled",y>34);
  if(VIEWS[el._route.n].after)VIEWS[el._route.n].after(el,el._route);
  drawTabs();
}
function showTab(tab){
  if(animating)return;
  if(tab===state.tab){ if(stacks[tab].length>1){stacks[tab]=[stacks[tab][0]];} else {const sc=topEl()?.querySelector(".sc");if(sc)sc.scrollTo({top:0,behavior:"smooth"});return} }
  state.tab=tab; const s=$("#stack"); s.innerHTML=""; stacks[tab].forEach((r,i)=>{const el=mountScreen(r);if(i<stacks[tab].length-1){el.style.transform="translateX(-30%)";el.classList.add("under")}s.appendChild(el)}); drawTabs();
}
function drawTabs(){$("#tabbar").innerHTML=TABS.map(([k,l,ic])=>`<button class="${state.tab===k?"on":""}" onclick="showTab('${k}')">${ic(state.tab===k)}<span>${l}</span></button>`).join("")}
const DUR=420, EASE="cubic-bezier(.32,.72,0,1)";
function push(route){
  if(animating)return; animating=true; hideBanner();
  const s=$("#stack"), prev=topEl(); stacks[state.tab].push(route);
  const el=mountScreen(route); el.style.transform="translateX(100%)"; el.style.boxShadow="-1px 0 0 var(--sep),-10px 0 30px rgba(0,0,0,.08)"; s.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    el.style.transition=prev.style.transition=`transform ${DUR}ms ${EASE}`;prev.querySelector(".shade").style.transition=`opacity ${DUR}ms ${EASE}`;
    el.style.transform="translateX(0)";prev.style.transform="translateX(-30%)";prev.querySelector(".shade").style.opacity=".08";prev.classList.add("under");
    setTimeout(()=>{el.style.transition=prev.style.transition="";animating=false},DUR+20);
  }));
}
function pop(){
  if(animating||stacks[state.tab].length<2)return; animating=true; hideBanner();
  const el=topEl(), prev=el.previousElementSibling; stacks[state.tab].pop();
  render0(prev);
  el.style.transition=prev.style.transition=`transform ${DUR*.85}ms ${EASE}`;prev.querySelector(".shade").style.transition=`opacity ${DUR*.85}ms ${EASE}`;
  el.style.transform="translateX(100%)";prev.style.transform="translateX(0)";prev.querySelector(".shade").style.opacity="0";prev.classList.remove("under");
  setTimeout(()=>{el.remove();prev.style.transition="";animating=false},DUR*.85+20);
}
function render0(el){const sc=el.querySelector(".sc"),y=sc.scrollTop;el.innerHTML=screenHTML(el._route);const sc2=el.querySelector(".sc");sc2.scrollTop=y;
  sc2.addEventListener("scroll",()=>el.classList.toggle("scrolled",sc2.scrollTop>(el._route.n==="person"||el._route.n==="client"?70:34)),{passive:true});
  if(VIEWS[el._route.n].after)VIEWS[el._route.n].after(el,el._route);el.querySelector(".shade").style.opacity=el.classList.contains("under")?".08":"0"}
/* swipe from the left edge to go back */
(function(){let x0=null,y0=0,dx=0,el=null,prev=null,t0=0,locked=false;
  document.addEventListener("touchstart",e=>{const t=e.touches[0];if(animating||stacks[state.tab].length<2||t.clientX>24||document.querySelector(".modal.on,.lock,#as.on"))return;
    x0=t.clientX;y0=t.clientY;dx=0;t0=Date.now();locked=false;el=topEl();prev=el.previousElementSibling},{passive:true});
  document.addEventListener("touchmove",e=>{if(x0==null)return;const t=e.touches[0];dx=Math.max(0,t.clientX-x0);
    if(!locked){if(Math.abs(t.clientY-y0)>Math.abs(dx)){x0=null;return}locked=true}
    const w=el.offsetWidth,p=Math.min(1,dx/w);el.style.transition=prev.style.transition="none";el.style.transform=`translateX(${dx}px)`;prev.style.transform=`translateX(${-30+30*p}%)`;prev.querySelector(".shade").style.opacity=String(.08*(1-p))},{passive:true});
  document.addEventListener("touchend",()=>{if(x0==null)return;const w=el.offsetWidth,v=dx/Math.max(1,Date.now()-t0);x0=null;
    if(dx>w*.35||v>.5){el.style.transition=prev.style.transition="";animating=false;
      const e2=el,p2=prev;stacks[state.tab].pop();render0(p2);e2.style.transition=p2.style.transition=`transform 280ms ${EASE}`;e2.style.transform="translateX(100%)";p2.style.transform="translateX(0)";p2.querySelector(".shade").style.opacity="0";p2.classList.remove("under");animating=true;setTimeout(()=>{e2.remove();p2.style.transition="";animating=false},300)}
    else{el.style.transition=prev.style.transition=`transform 280ms ${EASE}`;el.style.transform="translateX(0)";prev.style.transform="translateX(-30%)";prev.querySelector(".shade").style.opacity=".08";setTimeout(()=>{el.style.transition=prev.style.transition=""},300)}});
})();

  openModal({title:"Edit Site",right:{label:"Save",fn:async()=>{if(!F.name.trim())return;await put("sites",{...s0,name:F.name.trim(),clientId:F.clientId});closeModal();render();banner("Saved")}},
    body:()=>{const ws=[...new Set(DB.rates.filter(r=>r.siteId===sid).map(r=>r.workerId))];
    return `${sec(`<div class="cell"><input class="inp" value="${esc(F.name)}" autocapitalize="words" oninput="F.name=this.value;setRight(!!this.value.trim())"></div>`)}
    ${sec(DB.clients.map(c=>cell(`${ct(esc(c.name))}${F.clientId===c.id?I.check:""}`,{tap:`F.clientId='${c.id}';redrawModal()`})).join(""),{h:"Client"})}
    ${ws.length?sec(ws.map(id=>cell(`${avatar(W(id).name,32)}${ct(esc(W(id).name))}${I.chev}`,{tap:`closeModal();setTimeout(()=>openPerson('${id}'),250)`,style:"--inset:60px"})).join(""),{h:"Works here"}):""}
    ${used?sec("",{f:"This site has hours saved, so it can't be deleted."}).replace('<div class="grp"></div>',""):sec(cell("Delete Site",{tap:`confirmAsk('Delete this site?','Delete Site',async()=>{for(const r of DB.rates.filter(r=>r.siteId==='${sid}'))await del('rates',r.id);await del('sites','${sid}');closeModal();render();banner('Site deleted')})`,cls:"danger"}))}`}});
}

/* ============ connect · QR · PIN ============ */
function openConnect(){F={kind:"conn",code:"",err:""};
  openModal({title:"Google Sheet",body:()=>`<div class="phead" style="padding-top:6px"><div class="ic" style="background:#34C759;width:60px;height:60px;border-radius:14px;margin:0 auto 10px">${I.sheet.replace(/18/g,"32")}</div><div class="t1" style="font-weight:600;font-size:20px">Connect to your Google Sheet</div><div class="t2" style="white-space:normal;margin-top:4px">Your data is saved in your own Sheet and shared between your phone and laptop.</div></div>
    ${sec(cell(`${ic(I.qr,"#5856D6")}${ct("Scan QR Code")}${I.chev}`,{tap:"scanQR(c=>tryConnect(c))"}),{f:"In the Google Sheet: Crew Wages menu → Connect a device."})}
    ${sec(`<div class="cell"><textarea class="inp" id="cc" placeholder="Or paste the connect code (CW1.…)" autocapitalize="off" autocorrect="off" spellcheck="false" oninput="F.code=this.value">${esc(F.code)}</textarea></div>`+cell(`<span class="blue">Connect with Code</span>`,{tap:"tryConnect(F.code)"}),{f:F.err,ferr:!!F.err})}`});
}
async function tryConnect(text){
  const c=readCode(text);if(!c){if(M&&F.kind==="conn"){F.err="That isn't a Crew Wages connect code.";redrawModal()}else banner("That isn't a Crew Wages connect code");return}
  openModal({title:"Google Sheet",body:()=>`<div class="empty" style="padding-top:80px">Connecting…</div>`});
  let data;try{const prev=CONN;CONN=c;data=await api("getAll");CONN=prev}
  catch(e){CONN=null;openModal({title:"Google Sheet",body:()=>`${sec(cell(ct("Couldn't connect",e.server?esc(e.message):"No answer from Google. Check the internet, and that the script is deployed with access set to “Anyone”.")),{})}${sec(cell(`<span class="blue">Try Again</span>`,{tap:"openConnect()"}))}`});return}
  const sheetUrl=data.sheetUrl;delete data.sheetUrl;closeModal();
  setPin(async()=>{
    CONN={...c,s:sheetUrl};ls.set(K_CONN,CONN);OUT=[];ls.set(K_OUT,OUT);
    const empty=!data.workers.length&&!data.entries.length&&!data.clients.length,local=ls.get(KEY,null),hasLocal=local&&(local.workers.length||local.clients.length);
    if(empty&&hasLocal)actionSheet({title:"Connected",msg:"Your Sheet is empty. Copy what's on this device into it?",actions:[{label:"Copy My Data to the Sheet",fn:async()=>{await replaceAll(local);afterConnect()}},{label:"Start With an Empty Sheet",fn:()=>{DB=data;saveLocal();afterConnect()}}]});
    else{DB=data;saveLocal();afterConnect()}
  });
}
function afterConnect(){SYNC.at=new Date();state.month=nowM();Object.keys(stacks).forEach(k=>stacks[k]=[stacks[k][0]]);state.tab="";showTab("home");setSync("idle");banner("Connected to your Google Sheet")}
function disconnect(){confirmAsk("Disconnect this device?","Disconnect",()=>{CONN=null;[K_CONN,K_CACHE,K_OUT,K_PIN].forEach(k=>ls.del(k));OUT=[];DB=ls.get(KEY,null)||EMPTY();render();banner("Disconnected")},"Your data stays safe in the Google Sheet.")}
async function showConnectQR(){const code=makeCode(CONN);
  openModal({title:"Connect Device",left:"Done",body:()=>`<div style="background:#fff;border-radius:14px;margin:6px 16px 10px;padding:16px;display:grid;place-items:center;min-height:270px" id="qrbox">Loading…</div>
    <div class="gf" style="text-align:center;padding:0 24px 18px">On the other device: More → Connect to Google Sheet → Scan QR Code. Keep this private — it opens your data.</div>
    ${sec(cell(`<span class="blue">Copy Code Instead</span>`,{tap:"copyCode()"}))}`,
    after:async()=>{try{await loadScript(CDN_QR);const q=qrcode(0,"M");q.addData(code);q.make();$("#qrbox").innerHTML=q.createSvgTag({cellSize:5,margin:2,scalable:true});const sv=$("#qrbox svg");if(sv){sv.style.width="240px";sv.style.height="240px"}}catch(e){const b=$("#qrbox");if(b)b.textContent="Couldn't draw the QR — use Copy Code."}}});
}
async function copyCode(){try{await navigator.clipboard.writeText(makeCode(CONN));banner("Code copied")}catch(e){banner("Couldn't copy")}}
let scanStop=null;
async function scanQR(onCode){
  const stop=()=>{if(scanStop)scanStop();scanStop=null};
  openModal({title:"Scan QR Code",onClose:stop,body:()=>`<div style="margin:6px 16px 12px;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:1;position:relative"><video id="qv" playsinline muted style="width:100%;height:100%;object-fit:cover"></video><div style="position:absolute;inset:18%;border:3px solid rgba(255,255,255,.85);border-radius:20px"></div></div><div class="gf" id="qerr" style="text-align:center">Point the camera at the QR code in your Google Sheet.</div>`});
  try{await loadScript(CDN_SCAN);const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});
    const v=$("#qv");if(!v){st.getTracks().forEach(t=>t.stop());return}v.srcObject=st;await v.play();
    const cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});let live=true;scanStop=()=>{live=false;st.getTracks().forEach(t=>t.stop())};
    const tick=()=>{if(!live)return;if(v.videoWidth){cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);const r=jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height,{inversionAttempts:"dontInvert"});
      if(r&&r.data&&r.data.includes("CW1.")){stop();onCode(r.data);return}}requestAnimationFrame(tick)};tick();
  }catch(e){stop();const q=$("#qerr");if(q){q.classList.add("err");q.textContent="Camera not available. Allow camera access in Settings, or go back and paste the code."}}
}
function pinPad(title,sub,onDone,opts={}){
  let v="";const el=document.createElement("div");el.className="lock";document.body.appendChild(el);
  const draw=(shake)=>{el.innerHTML=`<div class="lk-in"><div class="lk-logo">C</div><div class="lk-t">${title}</div><div class="lk-s">${sub}</div>
    <div class="dots${shake?" shake":""}">${[0,1,2,3].map(i=>`<i class="${i<v.length?"on":""}"></i>`).join("")}</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9,"",0,"del"].map(k=>k===""?"<span></span>":k==="del"?`<button class="del" data-k="del">Delete</button>`:`<button data-k="${k}">${k}</button>`).join("")}</div>
    ${opts.cancel?`<button class="lk-c" id="lkc">Cancel</button>`:""}</div>`;
    el.querySelectorAll(".pad button").forEach(b=>b.onclick=async()=>{const k=b.dataset.k;if(k==="del")v=v.slice(0,-1);else if(v.length<4)v+=k;draw();
      if(v.length===4){const ok=await onDone(v);if(ok===false){v="";setTimeout(()=>draw(true),120)}else el.remove()}});
    const c=el.querySelector("#lkc");if(c)c.onclick=()=>{el.remove();opts.cancel()}};
  draw();
}
function setPin(done){
  pinPad("Create a PIN","Enter 4 digits to protect your data",first=>{
    setTimeout(()=>pinPad("Confirm Your PIN","Enter the same 4 digits again",async second=>{
      if(second!==first){banner("PINs didn't match — try again");setTimeout(()=>setPin(done),50);return true}
      const salt=uid();ls.set(K_PIN,{salt,h:await hashPin(first,salt),bad:0});done();return true}),10);return true});
}
function lockIfNeeded(){
  const p=ls.get(K_PIN,null);if(!online()||!p){unlocked=true;return}
  unlocked=false;
  pinPad("Enter PIN","Crew Wages is locked",async v=>{
    const p2=ls.get(K_PIN,null);if(await hashPin(v,p2.salt)===p2.h){p2.bad=0;ls.set(K_PIN,p2);unlocked=true;pull();return true}
    p2.bad=(p2.bad||0)+1;ls.set(K_PIN,p2);
    if(p2.bad>=5){CONN=null;[K_CONN,K_CACHE,K_OUT,K_PIN].forEach(k=>ls.del(k));OUT=[];DB=ls.get(KEY,null)||EMPTY();render();banner("Too many wrong PINs — disconnected");return true}
    banner(`Wrong PIN · ${5-p2.bad} ${5-p2.bad===1?"try":"tries"} left`);return false});
}

/* ---- data reset / restore ---- */
function resetDemo(sample,quiet){const go2=()=>{DB=sample?seed():EMPTY();saveLocal();if(sample)state.month="2026-11";Object.keys(stacks).forEach(k=>stacks[k]=[stacks[k][0]]);state.tab="";showTab("home");banner(sample?"Sample data loaded":"All data cleared")};
  if(quiet)return go2();confirmAsk(sample?"Replace everything with sample data?":"Delete all data on this device?",sample?"Load Sample Data":"Clear All Data",go2)}
function restore(file){if(!file)return;const r=new FileReader();r.onload=()=>{let d;try{d=JSON.parse(r.result);if(!TABLES.every(t=>Array.isArray(d[t])))throw 0}catch(e){banner("That file isn't a Crew Wages backup");return}
  confirmAsk("Replace everything with this backup?","Restore Backup",async()=>{await replaceAll(d);render();banner("Backup restored")})};r.readAsText(file)}

/* ============ start ============ */
(async()=>{
  await load();
  const ms=DB.entries.map(e=>e.month).sort();state.month=online()?nowM():(ms[ms.length-1]||nowM());
  state.tab="";showTab("home");lockIfNeeded();if(online()&&!ls.get(K_PIN,null))unlocked=true;if(unlocked)pull();
})();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});

</script>
