.dots.shake{animation:sh .35s}@keyframes sh{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}

.wcard .wr{text-align:right;flex:none}.wcard .wr b{display:block;font-size:18px;font-weight:780}.wcard .wr small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}

.wkhead{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}.wkhead b{font-size:16px}.wkhead small{color:var(--mut);font-size:13px}.wkhead .wkt{margin-left:auto;font-weight:750;font-size:15px}.wkhead .wk8{font-size:13px;padding:0 0 0 6px}
.wkcells{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.wkcells label{display:flex;flex-direction:column;align-items:center;gap:3px}.wkcells small{font-size:11px;color:var(--mut);font-weight:600}
.wkcells input,.wkcells span{width:100%;min-width:0;height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--field,#fff);text-align:center;font-size:16px;font-weight:650;padding:0;-webkit-appearance:none;outline:0;box-sizing:border-box}.wkcells span{display:grid;place-items:center}.wkcells input::placeholder{text-align:center;color:var(--mut)}
.wkm{row-gap:6px}.wkm>i{font-style:normal;font-size:11px;font-weight:700;color:var(--mut);text-align:center}.wkm small{font-size:10px}.wkm input,.wkm span{height:36px;font-size:15px}
.wkcells input:focus{border-color:var(--ink)}.wkcells .today small{color:var(--ink)}.wkcells .pd span{background:var(--ok-s);color:var(--ok);border-color:transparent}

/* native feel */
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;touch-action:manipulation}

.wcard:active,.tiles3 button:active,.addmenu button:active,.checkrow:active,.joincard:active{transform:scale(.97)}

.list{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}

/* search */

/* page header */

/* bottom nav */
.nav{position:fixed;left:14px;right:14px;bottom:calc(max(14px, env(safe-area-inset-bottom)) + 2px);display:flex;gap:10px;align-items:center;z-index:20;max-width:560px;margin:0 auto;pointer-events:none}

/* compact header that fades in on scroll */
#mini{position:fixed;top:0;left:0;right:0;height:calc(env(safe-area-inset-top) + 46px);padding-top:env(safe-area-inset-top);display:flex;align-items:center;justify-content:center;z-index:18;opacity:0;pointer-events:none;transition:opacity .2s;border-bottom:.5px solid rgba(14,19,37,.08);border-left:0;border-right:0;border-top:0;border-radius:0;box-shadow:none}

/* ===================== v3 design system ===================== */
:root{
  --bg:#F2F3F7; --card:#FFFFFF; --ink:#0A0B12; --ink2:#2E3242; --mut:#646A7E; --line:#E7E8EE; --soft:#F2F3F7; --soft2:#F7F8FA;
  --acc:#4B3FE0; --acc-s:#EEEDFF; --pay:#D92D3A; --pay-s:#FFEFF0; --ok:#0F7B45; --ok-s:#E7F6EE; --warn:#9A5B00; --warn-s:#FFF4E0;
  --r:22px; --sh:0 0 0 1px rgba(10,11,18,.04),0 1px 2px rgba(10,11,18,.04),0 6px 18px rgba(10,11,18,.04);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{--bg:#07080C;--card:#12141C;--ink:#F4F5FA;--ink2:#C9CCD8;--mut:#8C91A6;--line:#20232F;--soft:#1A1D28;--soft2:#151822;--acc:#8B83FF;--acc-s:#211F45;--sh:0 0 0 1px rgba(255,255,255,.05)}}
html,body{letter-spacing:-.011em}
.app{padding-left:18px;padding-right:18px}
.ptitle{font-size:32px!important;font-weight:760!important;letter-spacing:-.035em!important}
.sec{margin:30px 2px 12px}
.sec h2{font-size:20px;font-weight:740;letter-spacing:-.025em}
.sec .link{font-size:15px}
.card,.list,.stat{box-shadow:var(--sh);border-radius:var(--r)}
.row{padding:14px 18px;gap:14px;border-top-color:var(--line)}
.t1{font-weight:620;letter-spacing:-.015em}
.amt{font-weight:700;letter-spacing:-.02em}
/* avatars: soft gradient circles */
.av{border-radius:50%!important;font-weight:680;letter-spacing:0;background-image:linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,0))}
.ph .av{border-radius:50%!important}
/* buttons */
.btn{border-radius:16px;height:56px;font-weight:680;letter-spacing:-.01em;box-shadow:none;background:var(--ink);color:var(--bg)}
.btn.red{background:var(--pay);color:#fff}
.btn:disabled{background:var(--line)!important;color:var(--mut)!important}
.pay-btn{border-radius:999px!important;height:38px!important;padding:0 16px!important;font-size:14px}
/* segmented */
.pseg{background:var(--soft);border-radius:12px}
.pseg button{border-radius:10px;height:34px;font-weight:620}
.mgrid b{font-size:24px;font-weight:760;letter-spacing:-.035em}
.mgrid span{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;font-weight:620}
.mfoot{font-size:13px}
/* greeting header */
.greet{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 18px}
.greet small{display:block;font-size:12.5px;font-weight:650;color:var(--mut);text-transform:uppercase;letter-spacing:.07em}
.greet h1{font-size:30px;font-weight:770;letter-spacing:-.035em;margin-top:2px}
.greet .me{width:42px;height:42px;border-radius:50%;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;color:var(--ink2)}
/* hero */
.hero{background:radial-gradient(120% 140% at 100% 0%,#3A2FD6 0%,#1A1640 42%,#0A0B12 75%);border-radius:28px;padding:22px 22px 18px;box-shadow:0 18px 40px rgba(26,22,64,.28)}
.hero:after{display:none}
.hero .lbl{color:rgba(255,255,255,.62);font-size:13px;text-transform:uppercase;letter-spacing:.07em;font-weight:650}
.hero .big{font-size:48px;font-weight:780;letter-spacing:-.045em;margin:6px 0 2px}
.hero .sub{color:rgba(255,255,255,.7);font-size:14.5px}
.hero .hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:18px;position:relative;z-index:1}
.hero .hbtn{height:40px;padding:0 16px;border-radius:999px;background:#fff;color:#0A0B12;font-weight:680;font-size:14.5px;display:flex;align-items:center;gap:6px;flex:none}
.hero .hbtn:active{transform:scale(.96)}
.spark{display:flex;align-items:flex-end;gap:5px;height:44px;flex:1;max-width:190px}
.spark i{flex:1;border-radius:4px 4px 2px 2px;background:rgba(255,255,255,.22);min-height:3px}
.spark i.now{background:#fff}
.spark-l{font-size:11px;color:rgba(255,255,255,.55);margin-top:6px;text-align:right;letter-spacing:.02em}
/* quick actions */
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;font-weight:620;color:var(--ink2)}
.qa i{width:56px;height:56px;border-radius:18px;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;color:var(--acc)}
.qa button:active i{transform:scale(.93)}
.qa i svg{width:24px;height:24px}
/* KPI tiles */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 10px 10px}
.kpi{background:var(--soft2);border-radius:16px;padding:13px 14px}
.kpi span{display:block;font-size:12px;color:var(--mut);font-weight:640;text-transform:uppercase;letter-spacing:.05em}
.kpi b{display:block;font-size:22px;font-weight:760;letter-spacing:-.035em;margin-top:4px}
.kpi em{font-style:normal;font-size:12px;font-weight:650;margin-top:3px;display:inline-block}
.kpi em.up{color:var(--ok)} .kpi em.dn{color:var(--pay)} .kpi em.fl{color:var(--mut)}
/* site margin bar */
.mbar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:8px;display:flex}
.mbar i{display:block;height:100%}
.mbar i.w{background:#C9C6FF}.mbar i.p{background:var(--ok)}
/* problems as cards */
.problems{border-radius:18px}
@media (min-width:900px){.greet{display:none}.qa{display:none}}
/* ===================== v3b: Dribbble-style ===================== */
:root{
  --bg:#F3F1EC; --card:#FFFFFF; --ink:#111214; --ink2:#2B2D33; --mut:#6E6F76; --line:#ECEAE4; --soft:#F3F1EC; --soft2:#F8F7F3;
  --acc:#111214; --acc-s:#E9E7E1; --lime:#C9F26B; --lav:#D9D2FF; --peach:#FFD9C7; --sky:#C8E6FF; --mint:#C9F0DD;
  --pay:#E5484D; --pay-s:#FFE4E1; --ok:#1D7A46; --ok-s:#DDF5E6; --warn:#8A5A00; --warn-s:#FFF0CF;
  --r:28px; --sh:none;
  --font:"SF Pro Display",-apple-system,BlinkMacSystemFont,Inter,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{--bg:#0C0C0E;--card:#18181C;--ink:#F5F5F2;--ink2:#D2D2CF;--mut:#8D8D93;--line:#26262B;--soft:#1F1F24;--soft2:#1B1B20;--acc:#F5F5F2;--acc-s:#26262B;
  --lav:#3A3466;--peach:#5A3628;--ok:#7EE2A8;--pay:#FF7A7F;--warn:#F2C062;--sky:#20405C;--mint:#1E4A35;--pay-s:#3B1C1E;--ok-s:#153424;--warn-s:#3A2C10}}
html,body{background:var(--bg)}
.card,.list,.stat,.problems{border-radius:var(--r);box-shadow:none}
.row{border-top:1px solid var(--line)}
.sec h2{font-size:22px;font-weight:780;letter-spacing:-.035em}
.sec .link{color:var(--ink);font-weight:650;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px}
.link{color:var(--ink)}
.greet h1{font-size:34px;font-weight:800;letter-spacing:-.045em;line-height:1.05}
.greet small{color:var(--mut)}
.greet .me{background:var(--card);box-shadow:none;width:46px;height:46px}
/* hero: black card with lime */
.hero{background:#111214;border-radius:32px;padding:24px 22px 20px;box-shadow:none}
@media (prefers-color-scheme:dark){.hero{background:#1B1B20}}
.hero .lbl{color:rgba(255,255,255,.55)}
.hero .big{font-size:52px;font-weight:800;letter-spacing:-.05em;color:#fff}
.hero .hbtn{background:var(--lime);color:#111214;height:44px;padding:0 20px;font-weight:720}
.spark i{background:rgba(255,255,255,.16);border-radius:6px}
.spark i.now{background:var(--lime)}
/* quick actions: pastel tiles */
.qa{gap:10px;margin-top:12px}
.qa button{background:var(--card);border-radius:24px;padding:14px 4px 12px;gap:9px;color:var(--ink);font-weight:650}
.qa i{width:46px;height:46px;border-radius:50%;box-shadow:none;color:#111214}
.qa button:nth-child(1) i{background:var(--lime)}.qa button:nth-child(2) i{background:var(--lav)}
.qa button:nth-child(3) i{background:var(--peach)}.qa button:nth-child(4) i{background:var(--sky)}
@media (prefers-color-scheme:dark){.qa button:nth-child(n+2) i{color:#fff}}
/* KPI tiles in pastels */
.kpis{gap:10px;padding:6px 8px 8px}
.kpi{border-radius:22px;padding:16px}
.kpi:nth-child(1){background:var(--lav)}.kpi:nth-child(2){background:var(--peach)}.kpi:nth-child(3){background:var(--sky)}.kpi:nth-child(4){background:var(--lime)}
@media (prefers-color-scheme:dark){.kpi:nth-child(4){background:#33421A}}
.kpi b{font-size:25px}

.kpi em.up{color:#14663A} .kpi em.dn{color:#B4232B} .kpi em.fl{color:rgba(17,18,20,.55)}
@media (prefers-color-scheme:dark){.kpi em.up{color:#7EE2A8}.kpi em.dn{color:#FF8E8E}.kpi em.fl{color:rgba(255,255,255,.5)}}
.mcard{background:var(--card)}
.mfoot{border-top:0;padding-top:4px}
/* segmented: black pill */
.pseg{background:var(--soft);border-radius:999px;padding:4px}
.pseg button{border-radius:999px;color:var(--mut)}
.pseg button.on{background:var(--ink)!important;color:var(--bg)!important;box-shadow:none}
.seg{border-radius:999px}.seg .ind{border-radius:999px;background:var(--ink);box-shadow:none}.seg button.on{color:var(--bg)!important}
.month{background:var(--card);box-shadow:none;border-radius:999px}
.month button{border-radius:50%}
/* avatars: pastel */
.av{border-radius:50%!important;background-image:none}
/* buttons */
.btn{border-radius:999px;background:var(--ink);color:var(--bg)}
.btn.red{background:var(--pay)}
.btn.ghost{background:var(--card);color:var(--ink)}
.pay-btn{background:var(--ink)!important;color:var(--bg)!important;border-radius:999px!important}
.problems{background:var(--warn-s)}
/* site cards */
.kv div{border-radius:18px}
.kv div:nth-child(1){background:var(--sky)}.kv div:nth-child(2){background:var(--peach)}.kv div:nth-child(3){background:var(--lime)}
@media (prefers-color-scheme:dark){.kv div:nth-child(3){background:#33421A}}
.kv span{color:#111214}

.bar i,.mbar i.p{background:var(--ink)} .mbar i.w{background:var(--peach)}

.recv{border-radius:18px}

/* floating black nav, lime FAB */
.nav .tabsg{background:#111214!important;border:0!important;box-shadow:0 14px 30px rgba(0,0,0,.25)!important;-webkit-backdrop-filter:none;backdrop-filter:none}

@media (prefers-color-scheme:dark){.nav .tabsg{background:#1F1F24!important}}
#mini{background:rgba(243,241,236,.85)!important;border-bottom:0!important}
@media (prefers-color-scheme:dark){#mini{background:rgba(12,12,14,.85)!important}}
.sheet{border-radius:34px}
.inp{border-radius:18px;background:var(--soft2);border-color:transparent}
.inp:focus{border-color:var(--ink);box-shadow:none}
.opt{border-radius:999px;background:var(--card)}
.opt.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.opt.on small{color:var(--bg);opacity:.7}
.toast{border-radius:999px;background:#111214}
.toast button{color:var(--lime)}
.box.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.preview{border-radius:22px;background:var(--lime)}
.preview .pl,.preview .pv{color:#111214}

.month{background:var(--card)}

.m8{display:grid;background:var(--soft);border-radius:14px;padding:4px;gap:4px;margin:4px 6px 0}
.m8 button{height:48px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:680;font-size:14.5px;color:var(--ink2);line-height:1.15;min-width:0}

   radius: 8 tag · 12 small control · 14 control · 20 card · 28 panel
   height: 44 small · 52 control · 56 primary                                  */

<script>
function hideToast(){const t=document.getElementById("toast");if(t)t.classList.remove("on")}
if(window.navigator.standalone===true||matchMedia("(display-mode: standalone)").matches)document.documentElement.classList.add("ios-app");
const IS_IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const IS_APP=navigator.standalone===true||matchMedia("(display-mode: standalone)").matches;
const JOIN=(()=>{const m=(location.hash||"").match(/join=(CW1\.[A-Za-z0-9_\-]+)/);return m?m[1]:null})();
/* an invite opened in Safari: drop the manifest so the Home Screen icon keeps the invite in its start address */
if(JOIN&&!IS_APP){const l=document.querySelector('link[rel="manifest"]');if(l)l.remove()}
let deferredInstall=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;setTimeout(showInstallGuide,50)});
const APP_VERSION="7.3.2";
/* ============ data layer ============ */
const TABLES=["clients","sites","workers","rates","entries","income"];
const EMPTY=()=>({clients:[],sites:[],workers:[],rates:[],entries:[],income:[]});
let DB=EMPTY();
const KEY="crewwages_v2", K_CONN="cw_conn", K_CACHE="cw_cache", K_OUT="cw_outbox", K_PIN="cw_pin";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let CONN=ls.get(K_CONN,null);            // {u: web app url, k: key, s: sheet url}
let OUT=ls.get(K_OUT,[]);                // queued changes waiting to reach the Sheet
let SYNC={state:"idle",at:null};          // idle | syncing | offline | error
const online=()=>!!CONN;
function saveLocal(){ if(online()) ls.set(K_CACHE,DB); else ls.set(KEY,DB) }

async function api(action,payload={}){
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),30000);let r;try{r=await fetch(CONN.u,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({key:CONN.k,action,...payload}),redirect:"follow",signal:ctl.signal})}finally{clearTimeout(tm)}
  const txt=await r.text();let j;try{j=JSON.parse(txt)}catch(_){const e=new Error(/<html|<!doctype/i.test(txt)?"login":"bad");e.html=true;e.status=r.status;throw e}
  if(!j.ok){const e=new Error(j.error||"Failed");e.server=true;throw e}
  return j.data;
}
async function load(){
  if(online()){DB=ls.get(K_CACHE,null)||EMPTY();return}
  DB=ls.get(KEY,null)||EMPTY();
}
function queue(op){OUT.push(op);ls.set(K_OUT,OUT);flush()}
let flushing=false;
async function flush(){
  if(!online()||flushing)return; flushing=true; setSync("syncing");
  try{
    while(OUT.length){
      const op=OUT[0];
      await api(op.action,op);
      OUT.shift(); ls.set(K_OUT,OUT);
    }
    setSync("idle");
  }catch(e){
    if(e.server&&/key/i.test(e.message)){setSync("error");toast("This device was disconnected from the Sheet");}
    else setSync("offline");
  }finally{flushing=false}
}
async function pull(){
  if(!online())return;
  await flush(); if(OUT.length)return;
  setSync("syncing");if(!DB.workers.length&&!DB.entries.length&&ls.get(K_CACHE,null)===null)render();
  try{const d=await api("getAll"); if(d.sheetUrl){CONN.s=d.sheetUrl;ls.set(K_CONN,CONN)} delete d.sheetUrl;
      if(!OUT.length){DB=d;saveLocal();render()} setSync("idle");}
  catch(e){setSync(e.server?"error":"offline");if($("#app .skw"))render()}
}
function setSync(s){SYNC.state=s;if(s==="idle")SYNC.at=new Date();if(s!=="syncing"&&document.querySelector("#app .skw"))setTimeout(render,0);const el=document.getElementById("sync");if(el)el.outerHTML=syncBadge()}
function syncBadge(){
  if(!online())return `<span id="sync"></span>`;
  const n=OUT.length, st=SYNC.state;
  const [c,t]= st==="syncing"?["var(--mut)","Syncing…"]: (st==="offline"||n)?["var(--warn)",n?`Waiting to sync · ${n}`:"Offline"]: st==="error"?["var(--pay)","Not connected"]:["var(--ok)","Synced"];
  return `<span id="sync" class="syncb" onclick="pull()"><i style="background:${c}"></i>${t}</span>`;
}
async function put(table,row){
  const arr=DB[table]; const i=arr.findIndex(r=>r.id===row.id);
  if(i>=0)arr[i]=row; else arr.push(row);
  saveLocal(); if(online())queue({action:"upsertMany",table,rows:[row]});
}
async function del(table,id){
  DB[table]=DB[table].filter(r=>r.id!==id);
  saveLocal(); if(online())queue({action:"remove",table,id});
}
async function putMany(table,rows){
  for(const row of rows){const i=DB[table].findIndex(r=>r.id===row.id); if(i>=0)DB[table][i]=row; else DB[table].push(row)}
  saveLocal(); if(online())queue({action:"upsertMany",table,rows});
}
async function delMany(table,ids){if(!ids.length)return;const set=new Set(ids);DB[table]=DB[table].filter(r=>!set.has(r.id));saveLocal();if(online())queue({action:"removeMany",table,ids})}
/* delete several things at once, with one Undo for all of it */
async function cascadeDelete(parts,msg){const old={};for(const[t,rows]of parts){old[t]=rows.map(r=>({...r}));await delMany(t,rows.map(r=>r.id))}
  closeSheet();if(state.person&&!DB.workers.some(w=>w.id===state.person)&&!DB.sites.some(x=>"s:"+x.id===state.person)){state.pstack=state.pstack.filter(p=>DB.workers.some(w=>w.id===p)||DB.sites.some(x=>"s:"+x.id===p));state.person=state.pstack[state.pstack.length-1]||null}render();
  toast(msg,async()=>{for(const t of Object.keys(old))if(old[t].length)await putMany(t,old[t]);render()})}
function delWorker(id){const w=W(id),es=DB.entries.filter(e=>e.workerId===id),paid=es.filter(e=>e.paid).length;
  if(!confirmBox(`Delete ${w.name}?\n\nThis also deletes ${plural(es.length,"hour entry")}${paid?` (${paid} already paid)`:""}. You can tap Undo right after.`))return;

function delSiteAll(sid){const x=Sx(sid),es=DB.entries.filter(e=>e.siteId===sid);
  if(!confirmBox(`Delete ${x.name}?\n\nThis also deletes ${plural(es.length,"hour entry")} at this site. You can tap Undo right after.`))return;
  cascadeDelete([["entries",es],["rates",DB.rates.filter(r=>r.siteId===sid)],["sites",[x]]],`${esc(x.name)} deleted`)}
function delClientAll(cid){const c=C(cid),ss=DB.sites.filter(x=>x.clientId===cid),ids=new Set(ss.map(x=>x.id)),es=DB.entries.filter(e=>ids.has(e.siteId)),inc=DB.income.filter(i=>i.clientId===cid);
  if(!confirmBox(`Delete ${c.name}?\n\nThis also deletes ${plural(ss.length,"site")}, ${plural(es.length,"hour entry")} and ${plural(inc.length,"money-in record")}. You can tap Undo right after.`))return;

function wipeAll(){const t=prompt(online()?"This deletes EVERYTHING for every connected phone and laptop, and empties the Google Sheet.\n\nType DELETE to confirm.":"This deletes everything on this device.\n\nType DELETE to confirm.");
  if((t||"").trim().toUpperCase()!=="DELETE")return toast("Nothing deleted");const old=JSON.parse(JSON.stringify(DB));

  ["Bhawana","Edmonton Park",22],["Bhawana","Liverpool",25],["Binita","Hornsby",25],["Bishal Pradhan","Mascot",22],["Bishal Pradhan","Marrickville",25],["Gugun","Tavern",23],["Kiran Ghimire","Tavern",22],
  ["Pradeep","Townhall",20],["Rajesh","N Ryde",30],["Roshan","Blacktown",25],["Roshan","Greystanes",25],["Selisha","Mascot",22],["Sam Lee","Bupa Parramatta",26]];
  W.forEach(([n,s,r])=>{let w=d.workers.find(x=>x.name===n); if(!w){w={id:"w"+d.workers.length,name:n,active:true};d.workers.push(w)} d.rates.push({id:uid(),workerId:w.id,siteId:S(s),rate:r})});
  const months=["2026-08","2026-09","2026-10","2026-11"];
  const H={"Akash":[28,30,26,24],"Anish":[57,50,52,40],"Ankit Sharma":[68,60,64,38],"Binita":[19,20,18,16],"Bishal Pradhan":[41,44,40,36],"Gugun":[20,22,18,20],"Kiran Ghimire":[56,40,48,40],"Pradeep":[98,90,94,76],"Roshan":[19,24,20,22],"Selisha":[76,70,72,60],"Sam Lee":[0,30,32,28]};
  months.forEach((m,mi)=>{
    d.rates.forEach((r,ri)=>{
      const w=d.workers.find(x=>x.id===r.workerId); const h=(H[w.name]||[])[mi]; if(!h)return;
      const same=d.rates.filter(x=>x.workerId===w.id); const k=same.indexOf(r); const hh=same.length>1?(k===0?Math.round(h*.6):Math.round(h*.4)):h;
      if(!hh)return;
      const paid = mi<2 || (mi===2 && !["Bishal Pradhan","Selisha"].includes(w.name)) || (mi===3 && ["Akash","Gugun","Binita","Roshan","Pradeep","Ankit Sharma"].includes(w.name));

/* ============ calculations ============ */
/* ============ dates & periods ============ */
const pad2=n=>String(n).padStart(2,"0");
const isoD=d=>d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
const todayD=()=>isoD(new Date());
const parseD=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addD=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return isoD(d)};
const weekStart=s=>{const d=parseD(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return isoD(d)};
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const dayLabel=s=>{const d=parseD(s);return `${DOW[d.getDay()]} ${d.getDate()} ${MN[d.getMonth()]}`};
const dayRel=s=>s===todayD()?"Today":s===addD(todayD(),-1)?"Yesterday":dayLabel(s);
const weekLabel=s=>{const a=parseD(weekStart(s)),b=parseD(addD(weekStart(s),6));return a.getMonth()===b.getMonth()?`${a.getDate()}–${b.getDate()} ${MN[b.getMonth()]}`:`${a.getDate()} ${MN[a.getMonth()]} – ${b.getDate()} ${MN[b.getMonth()]}`};
const whenLabel=e=>e.date?dayLabel(e.date):`${mLabel(e.month)} · whole month`;
const sortKey=e=>(e.date||e.month+"-00");
function fortRange(d){const ws=weekStart(d);return [addD(ws,-7),addD(ws,6)]}
function l7Label(d){const a=parseD(addD(d,-6)),b=parseD(d);return a.getMonth()===b.getMonth()?`${a.getDate()}–${b.getDate()} ${MN[b.getMonth()]}`:`${a.getDate()} ${MN[a.getMonth()]} – ${b.getDate()} ${MN[b.getMonth()]}`}
function fortLabel(d){const[a,b]=fortRange(d),A=parseD(a),B=parseD(b);return A.getMonth()===B.getMonth()?`${A.getDate()}–${B.getDate()} ${MN[B.getMonth()]}`:`${A.getDate()} ${MN[A.getMonth()]} – ${B.getDate()} ${MN[B.getMonth()]}`}
function perRange(p){const td=todayD();if(p.mode==="l7")return [addD(p.d,-6),p.d];if(p.mode==="fort")return fortRange(p.d);if(p.mode==="range")return [p.from,p.to];if(p.mode==="week"){const ws=weekStart(p.d);return [ws,addD(ws,6)]}if(p.mode==="day")return [p.d,p.d];if(p.mode==="month"){const m=p.d.slice(0,7);return [m+"-01",mEnd(m)]}return null}
function rngLabel(a,b){const A=parseD(a),B=parseD(b);return a===b?dayLabel(a):A.getMonth()===B.getMonth()&&A.getFullYear()===B.getFullYear()?`${A.getDate()}–${B.getDate()} ${MN[B.getMonth()]}`:`${A.getDate()} ${MN[A.getMonth()]} – ${B.getDate()} ${MN[B.getMonth()]}`}
function inPer(e,p){if(p.mode==="all")return true;if(p.mode==="range")return !!e.date&&e.date>=p.from&&e.date<=p.to;if(p.mode==="l7"){const a=addD(p.d,-6);return !!e.date&&e.date>=a&&e.date<=p.d}if(p.mode==="fort"){const[a,b]=fortRange(p.d);return !!e.date&&e.date>=a&&e.date<=b}if(p.mode==="month")return e.month===p.d.slice(0,7);if(p.mode==="week")return !!e.date&&weekStart(e.date)===weekStart(p.d);return e.date===p.d}
function perLabel(p){if(p.mode==="all")return "All time";if(p.mode==="range")return rngLabel(p.from,p.to);if(p.mode==="l7")return l7Label(p.d);if(p.mode==="fort")return (fortRange(p.d)[1]===fortRange(todayD())[1]?"This fortnight · ":"")+fortLabel(p.d);if(p.mode==="month")return mLabel(p.d.slice(0,7));if(p.mode==="week")return (weekStart(p.d)===weekStart(todayD())?"This week · ":"")+weekLabel(p.d);return dayRel(p.d)}
function perStep(p,n){if(p.mode==="day")p.d=addD(p.d,n);else if(p.mode==="week")p.d=addD(p.d,7*n);else if(p.mode==="fort")p.d=addD(p.d,14*n);else if(p.mode==="l7"){p.d=addD(p.d,7*n);if(p.d>todayD())p.d=todayD()}else if(p.mode==="month"){const m=addM(p.d.slice(0,7),n);p.d=m===todayD().slice(0,7)?todayD():m+"-01"}}
const PERS={home:()=>state.per,person:()=>state.pper,site:()=>state.sper,sites:()=>state.slper};
function perSwitch(key,modes){const p=PERS[key]();
  const sub=k=>{const d=parseD(p.d);return k==="day"?`${DOW[d.getDay()]} ${d.getDate()}`:k==="week"?weekLabel(p.d):k==="fort"?fortLabel(p.d):k==="month"?FMN[d.getMonth()]:"Everything"};
  const full=k=>{const d=parseD(p.d);return k==="day"?dayRel(p.d)+(dayRel(p.d)===dayLabel(p.d)?"":" · "+dayLabel(p.d)):k==="week"||k==="fort"||k==="l7"?perLabel(p):FMN[d.getMonth()]+" "+d.getFullYear()};
  return `<div class="m8 ${modes.length>4?"m5":""}" style="grid-template-columns:${modes.length>4?modes.map(([k,l])=>(0.7+l.length*0.12).toFixed(2)+"fr").join(" "):`repeat(${modes.length},1fr)`}">${modes.map(([k,l])=>`<button class="${p.mode===k?"on":""}" onclick="PERS['${key}']().mode='${k}';render()">${l}<small>${sub(k)}</small></button>`).join("")}</div>
  ${p.mode==="all"?"":`<div class="mstep2"><button onclick="perStep(PERS['${key}'](),-1);render()" aria-label="Previous">‹</button><b>${full(p.mode)}</b><button onclick="perStep(PERS['${key}'](),1);render()" aria-label="Next">›</button></div>`}`}
const FMN=["January","February","March","April","May","June","July","August","September","October","November","December"];
function perStats(p,cut){const es=DB.entries.filter(e=>inPer(e,p)&&(!cut||!e.date||e.date<=cut));const hours=es.filter(isWork).reduce((s,e)=>s+ +e.hours,0),wages=es.reduce((s,e)=>s+wage(e),0);
  const income=p.mode==="month"?DB.income.filter(i=>i.month===p.d.slice(0,7)).reduce((s,i)=>s+ +i.amount,0):0;
  const hidden=p.mode==="day"||p.mode==="week"||p.mode==="fort"?DB.entries.filter(e=>!e.date&&(e.month===p.d.slice(0,7)||e.month===addD(weekStart(p.d),6).slice(0,7))).length:0;
  const T=profitTotals(p,cut);
  return {es,hours,wages,income,billed:T.billed,profit:T.profit,supW:T.supW,unsetN:T.unsetN,unsetW:T.unsetW,people:new Set(es.map(e=>e.workerId)).size,hidden}}
/* One rule everywhere: Profit = what you bill − wages, counted only at sites whose money-in is set */
function profitTotals(p,cut,filter){let billed=0,wK=0,unsetN=0,unsetW=0,feeN=0;
  DB.sites.filter(filter||(()=>true)).forEach(x=>{const r=siteStats(x,p,cut);if(r.b!=null){billed+=r.b;wK+=r.w}else if(r.w>0||r.h>0){if(r.note)feeN++;else unsetN++;unsetW+=r.w}});
  const supW=filter?0:DB.entries.filter(e=>e.siteId===SUP&&inPer(e,p)&&(!cut||!e.date||e.date<=cut)).reduce((a,e)=>a+wage(e),0);
  return {billed,wK,supW,profit:billed-wK-supW,unsetN,unsetW,feeN}}
function profitNote(T){const a=[];if(T.supW)a.push(`includes ${money(T.supW)} supervisors (company cost)`);if(T.unsetN)a.push(`${plural(T.unsetN,"site")} without a charge rate (${money(T.unsetW)} wages) not counted`);if(T.feeN)a.push(`${plural(T.feeN,"fixed-fee site")} only counted in Month view`);return a.join(" · ")}
/* Fair comparison: if the period is still running, compare with the same point in the previous one */
function prevCompare(p){const pp={...p};perStep(pp,-1);const t=todayD();let cut=null,lbl;
  const running=inPer({date:t,month:t.slice(0,7)},p);
  if(running){if(p.mode==="month"){const d=parseD(t),y=d.getMonth()===0?d.getFullYear()-1:d.getFullYear(),m=(d.getMonth()+11)%12,last=new Date(y,m+1,0).getDate();cut=y+"-"+pad2(m+1)+"-"+pad2(Math.min(d.getDate(),last))}else if(p.mode==="week")cut=addD(t,-7);else if(p.mode==="fort")cut=addD(t,-14);}
  lbl=p.mode==="month"?(running?"vs same day last month":"vs "+mShort(pp.d.slice(0,7))):p.mode==="week"?(running?"vs this time last week":"vs week before"):p.mode==="fort"?(running?"vs this time last fortnight":"vs fortnight before"):"vs day before";
  return {ps:perStats(pp,cut),lbl}}

const hasBill=x=>x.billType==="fixed"?(+x.fixed>0):(+x.charge>0);

function billFields(o,redraw){return `<div class="f"><label>Address <span style="color:var(--mut);font-weight:500">(optional)</span></label><input class="inp" placeholder="e.g. 12 George St, Parramatta" autocomplete="off" value="${esc(o.address||"")}" oninput="${redraw.obj}.address=this.value"></div>

  <input class="inp num" inputmode="decimal" placeholder="${(o.billType||"hourly")==="fixed"?"Amount per month, e.g. 4000":"Charge rate per hour, e.g. 35"}" value="${esc(o.billAmt||"")}" oninput="${redraw.obj}.billAmt=this.value"></div>

function owedByWorker(){ // all months
  const map={};
  DB.entries.filter(e=>!e.paid && e.hours>0 && e.rate>0).forEach(e=>{
    const o=map[e.workerId]||(map[e.workerId]={workerId:e.workerId,amount:0,entries:[],months:new Set(),sites:new Set()});

function workerExtras(id,es,P){

function clientField(label){

  return `<div class="f"><label>${label}</label><input class="inp" id="cq" placeholder="Type or pick a client" autocapitalize="words" autocomplete="off" autocorrect="off" spellcheck="false" value="${esc(F.cq||"")}" oninput="F.cq=this.value;F.err='';drawCsug()"><div id="csug" class="opts" style="margin-top:10px">${csugHtml()}</div></div>`;
}
function clientMatch(){const q=(F.cq||"").trim().toLowerCase();return q?DB.clients.find(c=>c.name.toLowerCase()===q):null}
function csugHtml(){
  const q=(F.cq||"").trim(),ql=q.toLowerCase(),hit=clientMatch();
  const n=id=>DB.sites.filter(x=>x.clientId===id).length;
  let cs=DB.clients.filter(c=>!ql||hit||c.name.toLowerCase().includes(ql)).sort((a,b)=>n(b.id)-n(a.id)||a.name.localeCompare(b.name)).slice(0,8);
  return cs.map(c=>`<button class="opt ${hit&&hit.id===c.id?"on":""}" onmousedown="event.preventDefault()" onclick="F.cq=C('${c.id}').name;F.err='';$('#cq').value=F.cq;drawCsug()">${esc(c.name)}</button>`).join("")
    +(q&&!hit?`<span class="t2" style="align-self:center;padding:4px 2px">${cs.length?"or ":""}“${esc(q)}” will be added as a new client</span>`:"");
}
function drawCsug(){const b=$("#csug");if(b)b.innerHTML=csugHtml()}
async function resolveClient(){const q=(F.cq||"").trim();if(!q)return null;const ex=clientMatch();if(ex)return ex.id;const c={id:uid(),name:q};await put("clients",c);return c.id}
function formSite(){
  return `<div class="f"><label>Site name</label><input class="inp" placeholder="e.g. Parramatta" autocapitalize="words" autocomplete="off" value="${esc(F.name)}" oninput="F.name=this.value"></div>
  ${clientField("Which company is it for?")}
  <div class="f"><label>Address <span style="color:var(--mut);font-weight:500">(optional)</span></label><input class="inp" placeholder="e.g. 12 George St, Parramatta" autocomplete="off" value="${esc(F.address||"")}" oninput="F.address=this.value"></div>
  ${F.showBill?`<div class="f"><label>They pay you <span style="color:var(--mut);font-weight:500">(optional)</span></label><div class="pseg" style="margin:0 0 10px">${[["hourly","per hour"],["fixed","per month"]].map(([k,l])=>`<button class="${(F.billType||"hourly")===k?"on":""}" onclick="F.billType='${k}';drawAdd()">${l}</button>`).join("")}</div>
    <input class="inp num" id="bamt" inputmode="decimal" placeholder="${(F.billType||"hourly")==="fixed"?"$ per month, e.g. 4000":"$ per hour, e.g. 35"}" value="${esc(F.billAmt||"")}" oninput="F.billAmt=this.value"><div class="hint" style="margin-top:8px">Used to show how much you keep. Skip if not sure.</div></div>`
  :`<button class="addrow" onclick="F.showBill=true;drawAdd();setTimeout(()=>$('#bamt')?.focus(),320)"><span><b>How much do they pay you?</b><small>Optional — shows how much you keep</small></span><i>+</i></button>`}
  ${F.err?`<div class="err">${F.err}</div>`:""}<button class="btn" onclick="saveSite()">Save site</button>`;
}
async function saveSite(){
  const name=F.name.trim(); if(!name)return F.err="Type a site name",drawAdd(); if(!(F.cq||"").trim())return F.err="Type or pick a client",drawAdd();
  if(DB.sites.some(s=>s.name.toLowerCase()===name.toLowerCase()))return F.err="That site already exists",drawAdd();
  F.clientId=await resolveClient();const amt=parseFloat(F.billAmt)||0,bt=F.billType||"hourly";
  const sid=uid();await put("sites",{id:sid,name,clientId:F.clientId,address:(F.address||"").trim(),billType:bt,charge:bt==="hourly"?amt:0,fixed:bt==="fixed"?amt:0});
  if(FBACK.length){backSub({siteId:sid});render();toast(`✓ Site added · ${esc(name)}`);return}
  closeSheet(); render(); toast(`✓ Site added · ${esc(name)}`);
}
function formClient(){

async function saveClient(){

let P={};
function billNudge(rows){const ss=[...new Set(rows.filter(e=>(e.kind||"work")==="work").map(e=>e.siteId))].map(Sx).filter(x=>x.id&&!hasBill(x));if(!ss.length)return;
  setTimeout(()=>showSheet(`<h3>Paid ✓ — one thing missing</h3><div class="lead">You haven't said how much comes in from ${ss.length===1?"this site":"these sites"}, so the app can't work out money in or profit.</div>
  <div style="margin-bottom:14px">${ss.map(x=>`<div class="check" onclick="editSite('${x.id}')"><div class="av" style="background:var(--warn-s);color:var(--warn)">!</div><div class="main"><div class="t1">${esc(x.name)}</div><div class="t2">${esc(C(x.clientId).name)} · add charge rate or fixed amount</div></div>${ICON.chev}</div>`).join("")}</div>
  <button class="btn ghost" style="margin-top:0" onclick="closeSheet()">Later</button>`),450)}
function paySel(k){const t=todayD(),f=k==="tf"?fortRange(t):k==="lf"?fortRange(addD(t,-14)):k==="tw"?[weekStart(t),addD(weekStart(t),6)]:k==="lw"?[addD(weekStart(t),-7),addD(weekStart(t),-1)]:null;
  P.k=k;P.sel=new Set(P.es.filter(e=>!f||(e.date&&e.date>=f[0]&&e.date<=f[1])).map(e=>e.id));drawPay()}
function openPay(wid,per){hideToast();
  const es=DB.entries.filter(e=>e.workerId===wid&&!e.paid&&e.hours>0&&e.rate>0).sort((a,b)=>sortKey(a).localeCompare(sortKey(b)));
  P={wid,sel:new Set(es.map(e=>e.id)),es,k:"all"};
  if(per&&per.mode!=="all"&&perRange(per)){const f=perRange(per);P.k=per.mode==="fort"&&f[1]===fortRange(todayD())[1]?"tf":per.mode==="fort"&&f[1]===fortRange(addD(todayD(),-14))[1]?"lf":"custom";P.sel=new Set(es.filter(e=>e.date&&e.date>=f[0]&&e.date<=f[1]).map(e=>e.id))}
  drawPay(); $("#sheet").classList.add("on");$("#scrim").classList.add("on");sheetClose=null;
}
function drawPay(){
  const w=W(P.wid); const tot=P.es.filter(e=>P.sel.has(e.id)).reduce((s,e)=>s+wage(e),0);
  $("#sheet").innerHTML=`<div class="grab"></div>
  <div style="display:flex;gap:14px;align-items:center;margin-bottom:12px">${av(w.name)}<div><h3 style="margin:0">Pay ${esc(w.name)}</h3><div class="t2">${P.es.length>1?"Untick anything you're not paying today":"Check it, then mark as paid"}</div></div></div>
  ${P.es.length>1?`<div class="pseg" style="margin:0 0 12px">${[["all","All"],["lf","Last fortnight"],["tf","This fortnight"]].map(([k,l])=>`<button class="${P.k===k?"on":""}" onclick="paySel('${k}')">${l}</button>`).join("")}</div>`:""}
  <div style="margin-bottom:16px">${P.es.map(e=>`<div class="check" onclick="P.k='custom';P.sel.has('${e.id}')?P.sel.delete('${e.id}'):P.sel.add('${e.id}');drawPay()"><div class="box ${P.sel.has(e.id)?"on":""}">${P.sel.has(e.id)?ICON.check:""}</div><div class="main"><div class="t1">${e.date?dayLabel(e.date):mLabel(e.month)+" (month)"} · ${esc(Sx(e.siteId).name)}</div><div class="t2">${e.hours} hrs × ${money(e.rate)}</div></div><div class="amt num">${money(wage(e))}</div></div>`).join("")}</div>
  <button class="btn red" ${P.sel.size?"":"disabled"} onclick="doPay()">Mark ${money(tot)} as paid</button>
  <button class="btn ghost" onclick="closeSheet()">Cancel</button>`;
}
async function doPay(){
  const today=new Date().toISOString().slice(0,10);
  const rows=P.es.filter(e=>P.sel.has(e.id)).map(e=>({...e,paid:true,paidAt:today}));
  const before=P.es.filter(e=>P.sel.has(e.id)).map(e=>({...e}));
  const tot=rows.reduce((s,e)=>s+wage(e),0), name=W(P.wid).name;
  await putMany("entries",rows); closeSheet(); render();
  toast(`✓ ${esc(name)} paid ${money(tot)}`,async()=>{await putMany("entries",before);render()});billNudge(rows);
}

    const diff=()=>{const el=$("#ediff");if(!el)return;const a0=wage(e),a1=(+F.e.hours||0)*(+F.e.rate||0);el.innerHTML=e.paid&&F.e.paid&&Math.abs(a1-a0)>.005?`<div class="dupbox"><b>⚠ Already paid ${money(a0)}</b><div class="t2" style="white-space:normal;margin-top:3px">New amount is ${money(a1)} — ${a1>a0?`you still owe ${money(a1-a0)}. Turn Paid off and add the rest, or pay the difference.`:`${money(a0-a1)} was overpaid. Take it off their next pay.`}</div></div>`:Math.abs(a1-a0)>.005?`<div class="hint">Pay changes from ${money(a0)} to ${money(a1)}</div>`:""};
    $("#sheet").querySelectorAll(".inp.num").forEach(i=>i.addEventListener("input",diff));diff();
    const m1=$("#em1"),m2=$("#em2");if(m1){m1.onclick=()=>{F.e.month=addM(F.e.month,-1);draw()};m2.onclick=()=>{F.e.month=addM(F.e.month,1);draw()}}
    $("#pt").onclick=()=>{F.e.paid=!F.e.paid;F.e.paidAt=F.e.paid?new Date().toISOString().slice(0,10):"";draw()};
    $("#sv").onclick=async()=>{const old={...e};await put("entries",F.e);closeSheet();render();toast("✓ Changes saved",async()=>{await put("entries",old);render()})};
    $("#dl").onclick=async()=>{const old={...e};await del("entries",e.id);closeSheet();render();toast("Entry deleted",async()=>{await put("entries",old);render()})};
  };
  draw(); $("#sheet").classList.add("on");$("#scrim").classList.add("on");sheetClose=null;

const CDN_QR="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js";
const CDN_SCAN="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js";
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`)){res();return}const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("load"));document.head.appendChild(s)})}
const b64u={enc:s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""),dec:s=>decodeURIComponent(escape(atob(s.replace(/-/g,"+").replace(/_/g,"/"))))};
function makeCode(c){const g=GAI.get(),o={u:c.u,k:c.k};if(g&&g.k){o.g=g.k;o.gm=g.m}return "CW1."+b64u.enc(JSON.stringify(o))}
function readCode(t){t=(t||"").trim().replace(/\s+/g,"");const i=t.indexOf("CW1.");if(i<0)return null;try{const o=JSON.parse(b64u.dec(t.slice(i+4)));if(o.u)o.u=String(o.u).trim().replace(/\/u\/\d+\//,"/").replace(/\/dev(\?.*)?$/,"/exec");return o.u&&o.k?o:null}catch(e){return null}}

  <div id="cerr"></div>
  <button class="btn ghost" id="cp" style="margin-top:0">Connect with this code</button>
  <div class="hint" style="margin-top:14px">Get it from the owner's phone (<b>More → Add a person or device</b>) or from the Google Sheet (<b>Hourza → Connect a device</b>).</div>`);

  $("#cq").onclick=()=>scanQR(code=>tryConnect(code));
  $("#cp").onclick=()=>tryConnect($("#cc").value);
  $("#cpaste").onclick=async()=>{try{const t=await navigator.clipboard.readText();if(readCode(t)){$("#cc").value=t.trim();tryConnect(t)}else{$("#cc").value=t||"";$("#cerr").innerHTML='<div class="err">That isn\'t an invite. Copy the whole invite message or link, then tap Paste.</div>'}}catch(e){$("#cc").focus();toast("Long-press the box and tap Paste")}};
}
const IC_DOTS='<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>';
const IC_SHARE='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
const IC_ADDSQ='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M12 8v8M8 12h8"/></svg>';
function showInstallGuide(){
  if(IS_APP||$("#ig"))return;
  if(!JOIN&&ls.get("cw_ig_off",false))return;
  if(!IS_IOS&&!deferredInstall&&!JOIN)return;
  const el=document.createElement("div");el.id="ig";
  const head=JOIN?`<div class="igtag">✓ Invite saved</div><b>You're invited to Hourza</b>`:`<b>Add Hourza to your Home Screen</b>`;
  let body;
  if(deferredInstall)body=`<button class="btn" id="iginst" style="margin:12px 0 0">Install Hourza</button>`;
  else if(IS_IOS)body=`<div class="igsteps"><div><i>1</i><span>Tap</span><em>${IC_DOTS}</em><span>or</span><em>${IC_SHARE}</em></div><div><i>2</i><span>Tap</span><em>${IC_ADDSQ}</em><span><b>Add to Home Screen</b></span></div><div><i>3</i><span>Tap <b>Add</b></span></div></div>`;
  else body=`<div class="t2" style="white-space:normal;margin-top:6px">Open this link on your phone to install the app.</div>`;
  el.innerHTML=`<div class="igcard"><button class="igx" aria-label="Close">×</button>${head}${body}${JOIN?`<div class="t2" style="white-space:normal;margin-top:10px">Then open Hourza from your Home Screen and set your PIN.</div>`:""}</div>${IS_IOS&&!deferredInstall?'<div class="igarrow">↓</div>':""}`;
  document.body.appendChild(el);
  const copy=()=>{if(JOIN)try{navigator.clipboard.writeText(location.href.split("#")[0]+"#join="+JOIN)}catch(e){}};
  el.addEventListener("click",copy,{once:true});
  el.querySelector(".igx").onclick=e=>{e.stopPropagation();copy();el.remove();if(!JOIN)ls.set("cw_ig_off",true)};
  const ib=el.querySelector("#iginst");if(ib)ib.onclick=async()=>{copy();deferredInstall.prompt();try{await deferredInstall.userChoice}catch(e){}deferredInstall=null;el.remove()};
}
function autoJoin(){
  if(!JOIN||!IS_APP)return false;
  if(ls.get("cw_join_used",null)===JOIN)return false;
  const c=readCode(JOIN);if(!c)return false;
  if(CONN&&CONN.k===c.k&&CONN.u===c.u){ls.set("cw_join_used",JOIN);return false}
  ls.set("cw_join_used",JOIN);setTimeout(()=>tryConnect(JOIN),400);return true;
}
function needSheetForInvite(){hideToast();
  showSheet(`<h3>First, connect a Google Sheet</h3><div class="lead">Everyone you add shares one Google Sheet — that's where the data lives. Right now this phone keeps data only on itself, so there's nothing to share yet.</div>
  <div class="list" style="margin:6px 0 16px">
    <div class="row"><div class="av">1</div><div class="main"><div class="t1">Set up the Sheet once</div><div class="t2" style="white-space:normal">On a laptop: new Google Sheet → Extensions → Apps Script → paste the Hourza script → Deploy</div></div></div>
    <div class="row"><div class="av">2</div><div class="main"><div class="t1">Connect this phone</div><div class="t2" style="white-space:normal">In the Sheet: Hourza → Connect a device, then scan the QR here</div></div></div>
    <div class="row"><div class="av">3</div><div class="main"><div class="t1">Add people</div><div class="t2" style="white-space:normal">Then this button shows a QR that others scan with their Camera</div></div></div></div>
  <button class="btn" onclick="openConnect()">I have the Sheet — connect now</button><button class="btn ghost" onclick="closeSheet()">Later</button>`)}
let CW_LAST="";function fixConnect(){const u=($("#fixu")?.value||"").trim();if(!/^https:\/\/script\.google\.com\/.+\/exec/.test(u)){toast("Paste the link that ends with /exec");return}const o=readCode(CW_LAST);if(!o)return openConnect();tryConnect(makeCodeRaw({...o,u}))}
const makeCodeRaw=o=>"CW1."+b64u.enc(JSON.stringify(o));
async function tryConnect(text){
  const c=readCode(text);if(c)CW_LAST=text; const err=m=>{const e=$("#cerr");if(e)e.innerHTML=`<div class="err">${m}</div>`;else toast(m)};
  if(!c)return err("That isn't a Hourza connect code.");
  showSheet(`<div class="empty" style="padding:40px 0">Connecting…</div>`);
  let data;
  try{const prev=CONN;CONN=c;data=await api("getAll");CONN=prev}
  catch(e){CONN=null;showSheet(`<h3>Couldn't connect</h3><div class="lead">${e.server?esc(e.message):e.html?"Google asked for a sign-in instead of answering. In Apps Script: Deploy → New deployment → Web app → Who has access: <b>Anyone</b> → Deploy. Then copy a fresh code from the Sheet (Hourza → Connect a device).":"No answer from Google. Check the internet, and that the script is deployed with access set to “Anyone”."}</div><div class="hint" style="margin:-6px 0 14px;word-break:break-all">Link in code: …${esc(String(c.u||"").slice(-28))}</div><div class="f" style="margin-top:4px"><label>Fix it with the Web app link</label><input class="inp" id="fixu" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" autocorrect="off" spellcheck="false"></div><div class="hint" style="margin:-4px 0 12px">In Apps Script: Deploy → Manage deployments → Web app URL → Copy, then paste here.</div><button class="btn" onclick="fixConnect()">Connect with this link</button><button class="btn ghost" style="margin-top:10px" onclick="openConnect()">Try again</button>`);return}
  if(c.g&&!GAI.get())GAI.set({k:c.g,m:c.gm||"gemini-flash-latest",alt:[]});
  const sheetUrl=data.sheetUrl; delete data.sheetUrl;
  setPin(async()=>{
    CONN={...c,s:sheetUrl}; ls.set(K_CONN,CONN); OUT=[]; ls.set(K_OUT,OUT);
    const sheetEmpty=!data.workers.length&&!data.entries.length&&!data.clients.length;
    const local=ls.get(KEY,null); const hasLocal=local&&(local.workers.length||local.clients.length);
    if(sheetEmpty&&hasLocal){
      showSheet(`<h3>Connected ✓</h3><div class="lead">Your Sheet is empty. Copy what's on this device into it?</div>
      <button class="btn" id="cy">Copy my data to the Sheet</button><button class="btn ghost" id="cn">Start with an empty Sheet</button>`);
      $("#cy").onclick=async()=>{closeSheet();await replaceAll(local);afterConnect()};
      $("#cn").onclick=()=>{DB=data;saveLocal();closeSheet();afterConnect()};
    } else if(hasLocal){const T=["clients","sites","workers","rates","entries","income"],extra={};let n=0;
      T.forEach(t=>{const ids=new Set((data[t]||[]).map(r=>r.id));extra[t]=(local[t]||[]).filter(r=>!ids.has(r.id));n+=extra[t].length});
      if(!n){DB=data;saveLocal();closeSheet();afterConnect();return}
      showSheet(`<h3>Connected ✓</h3><div class="lead">This phone has things the Sheet doesn't: <b>${plural(extra.workers.length,"worker")}</b>, <b>${plural(extra.sites.length,"site")}</b>, <b>${extra.entries.length} hours ${extra.entries.length===1?"entry":"entries"}</b>. Add them to the Sheet so nothing is lost?</div>
      <button class="btn" id="cy">Add this phone's data to the Sheet</button><button class="btn ghost" id="cn">No, use only the Sheet</button><div class="hint" style="margin-top:10px">If the same person was added on both phones, you may see them twice — you can delete one later.</div>`);
      $("#cy").onclick=async()=>{closeSheet();DB=data;saveLocal();for(const t of T)if(extra[t].length)await putMany(t,extra[t]);render();afterConnect()};
      $("#cn").onclick=()=>{if(!confirmBox("Use only the Sheet? This phone's own data will be hidden (kept on the phone, not deleted)."))return;DB=data;saveLocal();closeSheet();afterConnect()};
    } else {DB=data;saveLocal();closeSheet();afterConnect()}
  });
}
function afterConnect(){SYNC.at=new Date();setSync("idle");const ms=DB.entries.map(e=>e.month).sort();state.month=nowM();go("home");toast("✓ Connected to your Google Sheet")}
function disconnect(){if(!confirmBox("Disconnect this device? Your data stays safe in the Google Sheet."))return;
  CONN=null;[K_CONN,K_CACHE,K_OUT,K_PIN].forEach(k=>ls.del(k));OUT=[];DB=ls.get(KEY,null)||EMPTY();go("more");toast("Disconnected")}

async function showConnectQR(){hideToast();const code=makeCode(CONN);
  const appUrl=location.origin+location.pathname;
  showSheet(`<h3>Add a person or device</h3><div class="lead">On their phone, open the <b>Camera</b> and scan this. Hourza opens with the invite ready — they add it to the Home Screen and set their own PIN.</div>
  <div id="qrbox" style="background:#fff;border-radius:18px;padding:16px;display:grid;place-items:center;min-height:260px">Loading…</div>
  <div class="hint" style="margin-top:12px">Keep this code private — it opens your data.</div>
  <button class="btn" id="shr">Send invite by message</button>
  <button class="btn ghost" id="cpy">Copy code only</button>`);
  $("#shr").onclick=async()=>{const txt=`You're invited to Hourza. Open this link in Safari, add it to your Home Screen, then open Hourza and set your PIN:\n\n${appUrl}#join=${code}`;
    try{if(navigator.share){await navigator.share({title:"Hourza invite",text:txt})}else{await navigator.clipboard.writeText(txt);toast("✓ Invite copied — paste it in a message")}}catch(e){}};
  $("#cpy").onclick=async()=>{try{await navigator.clipboard.writeText(code);toast("✓ Code copied")}catch(e){toast("Couldn't copy")}};
  try{await loadScript(CDN_QR);const q=qrcode(0,"M");q.addData(appUrl+"#join="+code);q.make();$("#qrbox").innerHTML=q.createSvgTag({cellSize:5,margin:2,scalable:true});const sv=$("#qrbox svg");if(sv){sv.style.width="240px";sv.style.height="240px"}}
  catch(e){$("#qrbox").textContent="Couldn't draw the QR — use Copy code."}
}

let scanStop=null;
async function scanQR(onCode){
  showSheet(`<h3>Scan QR code</h3><div class="lead">Point the camera at the QR on your laptop.</div>
  <div style="position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:1"><video id="qv" playsinline muted style="width:100%;height:100%;object-fit:cover"></video>
  <div style="position:absolute;inset:18%;border:3px solid rgba(255,255,255,.85);border-radius:18px"></div></div>
  <div id="qerr"></div><button class="btn ghost" id="qc">Cancel</button>`);
  const stop=()=>{if(scanStop)scanStop();scanStop=null};
  $("#qc").onclick=()=>{stop();openConnect()};
  try{
    await loadScript(CDN_SCAN);
    const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});
    const v=$("#qv");v.srcObject=st;await v.play();
    const cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});let live=true;
    scanStop=()=>{live=false;st.getTracks().forEach(t=>t.stop())};
    const tick=()=>{if(!live)return;if(v.videoWidth){cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);
      const r=jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height,{inversionAttempts:"dontInvert"});
      if(r&&r.data&&r.data.includes("CW1.")){stop();onCode(r.data);return}}requestAnimationFrame(tick)};tick();
  }catch(e){stop();$("#qerr").innerHTML=`<div class="err" style="margin-top:12px">Camera not available. Allow camera access, or go back and paste the code.</div>`}
}

/* ---- PIN ---- */
async function hashPin(pin,salt){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+":"+pin));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=0;for(const c of salt+pin)h=(h*31+c.charCodeAt(0))>>>0;return "x"+h}}
function pinPad(title,sub,onDone,opts={}){
  let v="";const el=document.createElement("div");el.className="lock";document.body.appendChild(el);
  const draw=(shake)=>{el.innerHTML=`<div class="lk-in"><div class="logo" style="width:56px;height:56px;border-radius:17px;margin:0 auto 18px;background:none;padding:0"><svg viewBox="0 0 100 100" width="100%" height="100%" aria-hidden="true"><rect width="100" height="100" rx="23.5" fill="#C9F26B"/><circle cx="50" cy="50" r="23" fill="none" stroke="#111" stroke-width="6.6"/><path d="M50 50V35.7M50 50l11 8.4" stroke="#111" stroke-width="6.6" stroke-linecap="round" fill="none"/><circle cx="76.5" cy="25.5" r="5.6" fill="#111"/></svg></div>
    <div class="lk-t">${title}</div><div class="lk-s">${sub}</div>
    <div class="dots${shake?" shake":""}">${[0,1,2,3].map(i=>`<i class="${i<v.length?"on":""}"></i>`).join("")}</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(k=>k===""?"<span></span>":`<button data-k="${k}">${k}</button>`).join("")}</div>
    ${opts.cancel?`<button class="link" id="lkc" style="margin-top:10px">Cancel</button>`:""}</div>`;
    el.querySelectorAll(".pad button").forEach(b=>b.onclick=async()=>{const k=b.dataset.k;if(k==="⌫")v=v.slice(0,-1);else if(v.length<4)v+=k;draw();
      if(v.length===4){const ok=await onDone(v);if(ok===false){v="";setTimeout(()=>draw(true),120)}else el.remove()}});
    const c=el.querySelector("#lkc");if(c)c.onclick=()=>{el.remove();opts.cancel()}};
  draw();
}
function setPin(done){closeSheet();
  pinPad("Create a PIN","4 digits to open the app",first=>{
    setTimeout(()=>pinPad("Repeat your PIN","Type the same 4 digits again",async second=>{
      if(second!==first){toast("PINs didn't match — try again");setTimeout(()=>setPin(done),50);return true}
      const salt=uid();ls.set(K_PIN,{salt,h:await hashPin(first,salt),bad:0});done();return true}),10);return true});
}
let unlocked=false;
function lockIfNeeded(){
  const p=ls.get(K_PIN,null); if(!online()||!p){unlocked=true;return}
  unlocked=false;
  pinPad("Enter PIN","Hourza is locked",async v=>{
    const p2=ls.get(K_PIN,null); if(await hashPin(v,p2.salt)===p2.h){p2.bad=0;ls.set(K_PIN,p2);unlocked=true;pull();return true}
    p2.bad=(p2.bad||0)+1;ls.set(K_PIN,p2);
    if(p2.bad>=5){CONN=null;[K_CONN,K_CACHE,K_OUT,K_PIN].forEach(k=>ls.del(k));OUT=[];DB=ls.get(KEY,null)||EMPTY();render();toast("Too many wrong PINs — this device was disconnected");return true}
    toast(`Wrong PIN · ${5-p2.bad} ${5-p2.bad===1?"try":"tries"} left`);return false});
}
let hiddenAt=0;
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")hiddenAt=Date.now();else if(online()&&unlocked&&hiddenAt&&Date.now()-hiddenAt>5*60*1000&&!document.querySelector(".lock"))lockIfNeeded()});

/* ---- export / backup ---- */
function download(name,text,type){if(location.hostname.includes("claude")){toast("Downloads work in the real app");throw 0}const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function exportCSV(){try{exportCSV_()}catch(e){}}
function exportCSV_(){
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const rows=[["Date","Month","Name","Site","Client","Hours","Rate","Wages","Paid","Paid on","Note"]].concat(
    DB.entries.slice().sort((a,b)=>sortKey(a).localeCompare(sortKey(b))||W(a.workerId).name.localeCompare(W(b.workerId).name))
    .map(e=>[e.date||"whole month",mLabel(e.month),W(e.workerId).name,Sx(e.siteId).name,C(Sx(e.siteId).clientId).name,e.hours,e.rate,wage(e),e.paid?"Yes":"No",e.paidAt,e.notes]));
  download("Hourza_hours.csv","﻿"+rows.map(r=>r.map(q).join(",")).join("\r\n"),"text/csv");toast("✓ Downloaded — opens in Excel");
}
function backup(){try{download(`Hourza_backup_${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(DB),"application/json");toast("✓ Backup downloaded")}catch(e){}}
function restore(file){if(!file)return;const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result);if(!TABLES.every(t=>Array.isArray(d[t])))throw 0;
  if(!confirmBox("Replace everything with this backup?"))return; await replaceAll(d); render(); toast("✓ Backup restored")}catch(e){toast("That file isn't a Crew Wages backup")}};r.readAsText(file)}
function confirmBox(m){try{return window.confirm(m)}catch(e){return true}}
function resetDemo(sample,quiet){if(sample&&online()){toast("Sample data is off while connected to your Sheet");return}if(!quiet&&!confirmBox(sample?"Replace everything with sample data?":"Delete all data on this device?"))return;DB=sample?seed():{clients:[],sites:[],workers:[],rates:[],entries:[],income:[]};saveLocal();state.person=null;if(sample){state.month="2026-11";state.per={mode:"month",d:todayD().startsWith("2026-11")?todayD():"2026-11-01"}}go("home");toast(sample?"Sample data loaded":"All data cleared")}

/* ============ start ============ */
(async()=>{
  $("#app").innerHTML=`<div class="empty" style="padding-top:40vh">Loading…</div>`;
  try{await load()}catch(e){$("#app").innerHTML=`<div class="empty" style="padding-top:35vh">Couldn't load your data.<br>Check the internet and refresh.</div>`;return}
  const ms=DB.entries.map(e=>e.month).sort(); state.month=online()?nowM():(ms[ms.length-1]||nowM());state.per.d=state.month===todayD().slice(0,7)?todayD():state.month+"-01";
  render(); if(!autoJoin()){lockIfNeeded(); if(online()&&!ls.get(K_PIN,null))unlocked=true; if(unlocked)pull();}
  setTimeout(showInstallGuide,900);
})();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
