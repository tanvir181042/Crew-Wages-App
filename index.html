.dots.shake{animation:sh .35s}@keyframes sh{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}

/* ===================== v3 design system ===================== */
:root{
  --bg:#F2F3F7; --card:#FFFFFF; --ink:#0A0B12; --ink2:#2E3242; --mut:#646A7E; --line:#E7E8EE; --soft:#F2F3F7; --soft2:#F7F8FA;
  --acc:#4B3FE0; --acc-s:#EEEDFF; --pay:#D92D3A; --pay-s:#FFEFF0; --ok:#0F7B45; --ok-s:#E7F6EE; --warn:#9A5B00; --warn-s:#FFF4E0;
  --r:22px; --sh:0 0 0 1px rgba(10,11,18,.04),0 1px 2px rgba(10,11,18,.04),0 6px 18px rgba(10,11,18,.04);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{--bg:#07080C;--card:#12141C;--ink:#F4F5FA;--ink2:#C9CCD8;--mut:#8C91A6;--line:#20232F;--soft:#1A1D28;--soft2:#151822;--acc:#8B83FF;--acc-s:#211F45;--sh:0 0 0 1px rgba(255,255,255,.05)}}
html,body{letter-spacing:-.011em}
.app{padding-left:18px;padding-right:18px}
.ptitle{font-size:32px!important;font-weight:760!important;letter-spacing:-.035em!important}
.sec{margin:30px 2px 12px}
.sec h2{font-size:20px;font-weight:740;letter-spacing:-.025em}
.sec .link{font-size:15px}
.card,.list,.stat{box-shadow:var(--sh);border-radius:var(--r)}
.row{padding:14px 18px;gap:14px;border-top-color:var(--line)}
.t1{font-weight:620;letter-spacing:-.015em}
.amt{font-weight:700;letter-spacing:-.02em}
/* avatars: soft gradient circles */
.av{border-radius:50%!important;font-weight:680;letter-spacing:0;background-image:linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,0))}
.ph .av{border-radius:50%!important}
/* buttons */
.btn{border-radius:16px;height:56px;font-weight:680;letter-spacing:-.01em;box-shadow:none;background:var(--ink);color:var(--bg)}
.btn.red{background:var(--pay);color:#fff}
.btn:disabled{background:var(--line)!important;color:var(--mut)!important}
.pay-btn{border-radius:999px!important;height:38px!important;padding:0 16px!important;font-size:14px}
/* segmented */
.pseg{background:var(--soft);border-radius:12px}
.pseg button{border-radius:10px;height:34px;font-weight:620}
.mgrid b{font-size:24px;font-weight:760;letter-spacing:-.035em}
.mgrid span{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;font-weight:620}
.mfoot{font-size:13px}
/* greeting header */
.greet{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 18px}
.greet small{display:block;font-size:12.5px;font-weight:650;color:var(--mut);text-transform:uppercase;letter-spacing:.07em}
.greet h1{font-size:30px;font-weight:770;letter-spacing:-.035em;margin-top:2px}
.greet .me{width:42px;height:42px;border-radius:50%;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;color:var(--ink2)}
/* hero */
.hero{background:radial-gradient(120% 140% at 100% 0%,#3A2FD6 0%,#1A1640 42%,#0A0B12 75%);border-radius:28px;padding:22px 22px 18px;box-shadow:0 18px 40px rgba(26,22,64,.28)}
.hero:after{display:none}
.hero .lbl{color:rgba(255,255,255,.62);font-size:13px;text-transform:uppercase;letter-spacing:.07em;font-weight:650}
.hero .big{font-size:48px;font-weight:780;letter-spacing:-.045em;margin:6px 0 2px}
.hero .sub{color:rgba(255,255,255,.7);font-size:14.5px}
.hero .hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:18px;position:relative;z-index:1}
.hero .hbtn{height:40px;padding:0 16px;border-radius:999px;background:#fff;color:#0A0B12;font-weight:680;font-size:14.5px;display:flex;align-items:center;gap:6px;flex:none}
.hero .hbtn:active{transform:scale(.96)}
.spark{display:flex;align-items:flex-end;gap:5px;height:44px;flex:1;max-width:190px}
.spark i{flex:1;border-radius:4px 4px 2px 2px;background:rgba(255,255,255,.22);min-height:3px}
.spark i.now{background:#fff}
.spark-l{font-size:11px;color:rgba(255,255,255,.55);margin-top:6px;text-align:right;letter-spacing:.02em}
/* quick actions */
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;font-weight:620;color:var(--ink2)}

.qa button:active i{transform:scale(.93)}
.qa i svg{width:24px;height:24px}
/* KPI tiles */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 10px 10px}
.kpi{background:var(--soft2);border-radius:16px;padding:13px 14px}
.kpi span{display:block;font-size:12px;color:var(--mut);font-weight:640;text-transform:uppercase;letter-spacing:.05em}

.kpi em.up{color:var(--ok)} .kpi em.dn{color:var(--pay)} .kpi em.fl{color:var(--mut)}
/* site margin bar */
.mbar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:8px;display:flex}
.mbar i{display:block;height:100%}
.mbar i.w{background:#C9C6FF}.mbar i.p{background:var(--ok)}
/* problems as cards */
.problems{border-radius:18px}
@media (min-width:900px){.greet{display:none}.qa{display:none}}
/* ===================== v3b: Dribbble-style ===================== */
:root{
  --bg:#F3F1EC; --card:#FFFFFF; --ink:#111214; --ink2:#2B2D33; --mut:#5F6067; --line:#ECEAE4; --soft:#F3F1EC; --soft2:#F8F7F3;

/* hero: black card with lime */

function splitV(d){if(!d)return d;d.roster=Array.isArray(d.roster)?d.roster:[];d.marks=Array.isArray(d.marks)?d.marks:[];d.meta=Array.isArray(d.meta)?d.meta:[];const keep=[],ri=new Set(d.roster.map(r=>r.id)),mi=new Set(d.marks.map(r=>r.id)),xi=new Set(d.meta.map(r=>r.id));

async function api(action,payload={}){

}
async function load(){

/* outbox: merge small changes into one request, split very big ones, retry with back-off */
const CHUNK=250;let INFLIGHT=false,RETRY=null,RDELAY=5000;
function queue(op){if(op.action==="upsertMany"&&op.rows&&op.rows.length>CHUNK){for(let i=0;i<op.rows.length;i+=CHUNK)queue({...op,rows:op.rows.slice(i,i+CHUNK)});return}
  if(op.action==="removeMany"&&op.ids&&op.ids.length>CHUNK){for(let i=0;i<op.ids.length;i+=CHUNK)queue({...op,ids:op.ids.slice(i,i+CHUNK)});return}
  const last=OUT[OUT.length-1],canMerge=last&&!(INFLIGHT&&OUT.length===1)&&last.table===op.table&&last.action===op.action;
  if(canMerge&&op.action==="upsertMany"&&last.rows.length+op.rows.length<=CHUNK){const m=new Map(last.rows.map(r=>[r.id,r]));op.rows.forEach(r=>m.set(r.id,r));last.rows=[...m.values()]}
  else if(canMerge&&op.action==="removeMany"&&last.ids.length+op.ids.length<=CHUNK){last.ids=[...new Set([...last.ids,...op.ids])]}

/* ============ dates & periods ============ */
const pad2=n=>String(n).padStart(2,"0");
const isoD=d=>d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
const todayD=()=>isoD(new Date());
const parseD=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addD=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return isoD(d)};
const weekStart=s=>{const d=parseD(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return isoD(d)};
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const dayLabel=s=>{const d=parseD(s);return `${DOW[d.getDay()]} ${d.getDate()} ${MN[d.getMonth()]}`};
const dayRel=s=>s===todayD()?"Today":s===addD(todayD(),-1)?"Yesterday":dayLabel(s);
const weekLabel=s=>{const a=parseD(weekStart(s)),b=parseD(addD(weekStart(s),6));return a.getMonth()===b.getMonth()?`${a.getDate()}–${b.getDate()} ${MN[b.getMonth()]}`:`${a.getDate()} ${MN[a.getMonth()]} – ${b.getDate()} ${MN[b.getMonth()]}`};
const whenLabel=e=>e.date?dayLabel(e.date):`${mLabel(e.month)} · whole month`;
const sortKey=e=>(e.date||e.month+"-00");
function fortRange(d){const ws=weekStart(d);return [addD(ws,-7),addD(ws,6)]}
function l7Label(d){const a=parseD(addD(d,-6)),b=parseD(d);return a.getMonth()===b.getMonth()?`${a.getDate()}–${b.getDate()} ${MN[b.getMonth()]}`:`${a.getDate()} ${MN[a.getMonth()]} – ${b.getDate()} ${MN[b.getMonth()]}`}
function fortLabel(d){const[a,b]=fortRange(d),A=parseD(a),B=parseD(b);return A.getMonth()===B.getMonth()?`${A.getDate()}–${B.getDate()} ${MN[B.getMonth()]}`:`${A.getDate()} ${MN[A.getMonth()]} – ${B.getDate()} ${MN[B.getMonth()]}`}
function perRange(p){const td=todayD();if(p.mode==="l7")return [addD(p.d,-6),p.d];if(p.mode==="fort")return fortRange(p.d);if(p.mode==="range")return [p.from,p.to];if(p.mode==="week"){const ws=weekStart(p.d);return [ws,addD(ws,6)]}if(p.mode==="day")return [p.d,p.d];if(p.mode==="month"){const m=p.d.slice(0,7);return [m+"-01",mEnd(m)]}return null}
function rngLabel(a,b){const A=parseD(a),B=parseD(b);return a===b?dayLabel(a):A.getMonth()===B.getMonth()&&A.getFullYear()===B.getFullYear()?`${A.getDate()}–${B.getDate()} ${MN[B.getMonth()]}`:`${A.getDate()} ${MN[A.getMonth()]} – ${B.getDate()} ${MN[B.getMonth()]}`}
function inPer(e,p){if(p.mode==="all")return true;if(p.mode==="range")return !!e.date&&e.date>=p.from&&e.date<=p.to;if(p.mode==="l7"){const a=addD(p.d,-6);return !!e.date&&e.date>=a&&e.date<=p.d}if(p.mode==="fort"){const[a,b]=fortRange(p.d);return !!e.date&&e.date>=a&&e.date<=b}if(p.mode==="month")return e.month===p.d.slice(0,7);if(p.mode==="week")return !!e.date&&weekStart(e.date)===weekStart(p.d);return e.date===p.d}
function perLabel(p){if(p.mode==="all")return "All time";if(p.mode==="range")return rngLabel(p.from,p.to);if(p.mode==="l7")return l7Label(p.d);if(p.mode==="fort")return (fortRange(p.d)[1]===fortRange(todayD())[1]?"This fortnight · ":"")+fortLabel(p.d);if(p.mode==="month")return mLabel(p.d.slice(0,7));if(p.mode==="week")return (weekStart(p.d)===weekStart(todayD())?"This week · ":"")+weekLabel(p.d);return dayRel(p.d)}
function perStep(p,n){if(p.mode==="day")p.d=addD(p.d,n);else if(p.mode==="week")p.d=addD(p.d,7*n);else if(p.mode==="fort")p.d=addD(p.d,14*n);else if(p.mode==="l7"){p.d=addD(p.d,7*n);if(p.d>todayD())p.d=todayD()}else if(p.mode==="month"){const m=addM(p.d.slice(0,7),n);p.d=m===todayD().slice(0,7)?todayD():m+"-01"}}
function rngDef(){const t=todayD(),d=+t.slice(8),m=t.slice(0,7);return d>=25?{from:m+"-25",to:t}:{from:addM(m,-1)+"-25",to:t}}
function perMode(key,k){const p=PERS[key]();p.mode=k;if(k==="range"&&!(p.from&&p.to)){const r=rngDef();p.from=r.from;p.to=r.to}render()}
function perSet(key,f,v){if(!v)return;const p=PERS[key]();p[f]=v;if(p.from>p.to)p[f==="from"?"to":"from"]=v;render()}
const PERS={hw:()=>state.hper,home:()=>state.per,person:()=>state.pper,site:()=>state.sper,sites:()=>state.slper};
function perSwitch(key,modes){const p=PERS[key]();if(!p.d)p.d=p.to||todayD();
  const sub=k=>{const d=parseD(p.d);return k==="day"?`${DOW[d.getDay()]} ${d.getDate()}`:k==="week"?weekLabel(p.d):k==="fort"?fortLabel(p.d):k==="month"?FMN[d.getMonth()]:k==="range"?(p.from?rngLabel(p.from,p.to):"Pick dates"):"Everything"};
  const full=k=>{const d=parseD(p.d);return k==="day"?dayRel(p.d)+(dayRel(p.d)===dayLabel(p.d)?"":" · "+dayLabel(p.d)):k==="week"||k==="fort"||k==="l7"?perLabel(p):FMN[d.getMonth()]+" "+d.getFullYear()};
  return `<div class="m8 ${modes.length>4?"m5":""}" style="grid-template-columns:${modes.length>4?modes.map(([k,l])=>(0.7+l.length*0.12).toFixed(2)+"fr").join(" "):`repeat(${modes.length},1fr)`}">${modes.map(([k,l])=>`<button class="${p.mode===k?"on":""}" onclick="perMode('${key}','${k}')">${l}<small>${sub(k)}</small></button>`).join("")}</div>
  ${p.mode==="range"?`<div class="two" style="margin-top:10px;gap:10px"><div class="f" style="margin:0"><label>From</label><input class="inp" type="date" value="${p.from}" onchange="perSet('${key}','from',this.value)"></div><div class="f" style="margin:0"><label>To</label><input class="inp" type="date" value="${p.to}" onchange="perSet('${key}','to',this.value)"></div></div>`:""}
  ${p.mode==="all"||p.mode==="range"?"":`<div class="mstep2"><button onclick="perStep(PERS['${key}'](),-1);render()" aria-label="Previous">‹</button><b>${full(p.mode)}</b><button onclick="perStep(PERS['${key}'](),1);render()" aria-label="Next">›</button></div>`}`}
const FMN=["January","February","March","April","May","June","July","August","September","October","November","December"];
function perStats(p,cut){const es=DB.entries.filter(e=>inPer(e,p)&&(!cut||!e.date||e.date<=cut));const hours=es.filter(isWork).reduce((s,e)=>s+ +e.hours,0),wages=es.reduce((s,e)=>s+wage(e),0);
  const income=p.mode==="month"?DB.income.filter(i=>i.month===p.d.slice(0,7)).reduce((s,i)=>s+ +i.amount,0):0;
  const hidden=p.mode==="day"||p.mode==="week"||p.mode==="fort"?DB.entries.filter(e=>!e.date&&(e.month===p.d.slice(0,7)||e.month===addD(weekStart(p.d),6).slice(0,7))).length:0;
  const T=profitTotals(p,cut);
  return {es,hours,wages,income,billed:T.billed,profit:T.profit,supW:T.supW,unsetN:T.unsetN,unsetW:T.unsetW,people:new Set(es.map(e=>e.workerId)).size,hidden}}
/* One rule everywhere: Profit = what you bill − wages, counted only at sites whose money-in is set */
function profitTotals(p,cut,filter){let billed=0,wK=0,unsetN=0,unsetW=0,feeN=0;
  DB.sites.filter(filter||(()=>true)).forEach(x=>{const r=siteStats(x,p,cut);if(r.b!=null){billed+=r.b;wK+=r.w}else if(r.w>0||r.h>0){if(r.note)feeN++;else unsetN++;unsetW+=r.w}});
  const supW=filter?0:DB.entries.filter(e=>e.siteId===SUP&&inPer(e,p)&&(!cut||!e.date||e.date<=cut)).reduce((a,e)=>a+wage(e),0);
  return {billed,wK,supW,profit:billed-wK-supW,unsetN,unsetW,feeN}}
function profitNote(T){const a=[];if(T.supW)a.push(`includes ${money(T.supW)} supervisors (company cost)`);if(T.unsetN)a.push(`${plural(T.unsetN,"site")} without a charge rate (${money(T.unsetW)} wages) not counted`);if(T.feeN)a.push(`${plural(T.feeN,"fixed-fee site")} only counted in Month view`);return a.join(" · ")}

function prevCompare(p){const pp={...p};perStep(pp,-1);const t=todayD();let cut=null,lbl;

If the user asks to add/create/change something but leaves out details (e.g. "can you add a site for me"), still return that action with the missing fields null — the app opens a form for them. NEVER put a command into "query"; "query" is only for questions about existing data.
If the request is unclear (e.g. two workers share a first name), ask a short question in "say" with action null.

Names may be misspelled or mis-heard (voice, accents, Nepali/Bangla/English): always pick the closest worker/site/client from the lists by sound and spelling (e.g. "Aayush", "Ayus", "Ayush" are the same person). Only ask if two names are equally close.
Understand the MEANING, not keywords. People talk casually, indirectly, with typos, mixed languages and incomplete sentences — work out what they want. If something is missing, choose the most sensible default (today, the person's only site) or ask ONE short question; never reply that you can't find it.

    const local=ls.get(KEY,null); const hasLocal=local&&(local.workers.length||local.clients.length);
    if(sheetEmpty&&hasLocal){
      showSheet(`<h3>Connected ✓</h3><div class="lead">Your Sheet is empty. Copy what's on this device into it?</div>
      <button class="btn" id="cy">Copy my data to the Sheet</button><button class="btn ghost" id="cn">Start with an empty Sheet</button>`);
      $("#cy").onclick=async()=>{closeSheet();await replaceAll(local);afterConnect()};
      $("#cn").onclick=()=>{DB=splitV(data);saveLocal();closeSheet();afterConnect()};
    } else if(hasLocal){const T=["clients","sites","workers","rates","entries","income"],extra={};let n=0;
      T.forEach(t=>{const ids=new Set((data[t]||[]).map(r=>r.id));extra[t]=(local[t]||[]).filter(r=>!ids.has(r.id));n+=extra[t].length});
      if(!n){DB=splitV(data);saveLocal();closeSheet();afterConnect();return}
      showSheet(`<h3>Connected ✓</h3><div class="lead">This phone has things the Sheet doesn't: <b>${plural(extra.workers.length,"worker")}</b>, <b>${plural(extra.sites.length,"site")}</b>, <b>${extra.entries.length} hours ${extra.entries.length===1?"entry":"entries"}</b>. Add them to the Sheet so nothing is lost?</div>
      <button class="btn" id="cy">Add this phone's data to the Sheet</button><button class="btn ghost" id="cn">No, use only the Sheet</button><div class="hint" style="margin-top:10px">If the same person was added on both phones, you may see them twice — you can delete one later.</div>`);
      $("#cy").onclick=async()=>{closeSheet();DB=splitV(data);saveLocal();for(const t of T)if(extra[t].length)await putMany(t,extra[t]);render();afterConnect()};
      $("#cn").onclick=()=>{if(!confirmBox("Use only the Sheet? This phone's own data will be hidden (kept on the phone, not deleted)."))return;DB=splitV(data);saveLocal();closeSheet();afterConnect()};
    } else {DB=splitV(data);saveLocal();closeSheet();afterConnect()}
  });
}
function afterConnect(){SYNC.at=new Date();setSync("idle");const ms=DB.entries.map(e=>e.month).sort();state.month=nowM();go("home");toast("✓ Connected to your Google Sheet")}
function disconnect(){if(!confirmBox("Disconnect this device? Your data stays safe in the Google Sheet."))return;
  CONN=null;[K_CONN,K_CACHE,K_OUT,K_PIN].forEach(k=>ls.del(k));OUT=[];DB=ls.get(KEY,null)||EMPTY();go("more");toast("Disconnected")}

let scanStop=null;
async function scanQR(onCode){
  showSheet(`<h3>Scan QR code</h3><div class="lead">Point the camera at the QR on your laptop.</div>
  <div style="position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:1"><video id="qv" playsinline muted style="width:100%;height:100%;object-fit:cover"></video>
  <div style="position:absolute;inset:18%;border:3px solid rgba(255,255,255,.85);border-radius:18px"></div></div>
  <div id="qerr"></div><button class="btn ghost" id="qc">Cancel</button>`);
  const stop=()=>{if(scanStop)scanStop();scanStop=null};
  $("#qc").onclick=()=>{stop();openConnect()};
  try{
    await loadScript(CDN_SCAN);
    const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});
    const v=$("#qv");v.srcObject=st;await v.play();
    const cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});let live=true;
    scanStop=()=>{live=false;st.getTracks().forEach(t=>t.stop())};
    const tick=()=>{if(!live)return;if(v.videoWidth){cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);
      const r=jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height,{inversionAttempts:"dontInvert"});
      if(r&&r.data&&r.data.includes("CW1.")){stop();onCode(r.data);return}}requestAnimationFrame(tick)};tick();
  }catch(e){stop();$("#qerr").innerHTML=`<div class="err" style="margin-top:12px">Camera not available. Allow camera access, or go back and paste the code.</div>`}
}

/* ---- PIN ---- */
async function hashPin(pin,salt){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+":"+pin));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=0;for(const c of salt+pin)h=(h*31+c.charCodeAt(0))>>>0;return "x"+h}}
function pinPad(title,sub,onDone,opts={}){
  let v="";const el=document.createElement("div");el.className="lock";document.body.appendChild(el);
  const draw=(shake)=>{el.innerHTML=`<div class="lk-in"><div class="logo" style="width:56px;height:56px;border-radius:17px;margin:0 auto 18px;background:none;padding:0"><svg viewBox="0 0 100 100" width="100%" height="100%" aria-hidden="true"><rect width="100" height="100" rx="23.5" fill="#C9F26B"/><circle cx="50" cy="50" r="23" fill="none" stroke="#111" stroke-width="6.6"/><path d="M50 50V35.7M50 50l11 8.4" stroke="#111" stroke-width="6.6" stroke-linecap="round" fill="none"/><circle cx="76.5" cy="25.5" r="5.6" fill="#111"/></svg></div>
    <div class="lk-t">${title}</div><div class="lk-s">${sub}</div>
    <div class="dots${shake?" shake":""}">${[0,1,2,3].map(i=>`<i class="${i<v.length?"on":""}"></i>`).join("")}</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(k=>k===""?"<span></span>":`<button data-k="${k}">${k}</button>`).join("")}</div>
    ${opts.cancel?`<button class="link" id="lkc" style="margin-top:10px">Cancel</button>`:""}</div>`;
    el.querySelectorAll(".pad button").forEach(b=>b.onclick=async()=>{const k=b.dataset.k;if(k==="⌫")v=v.slice(0,-1);else if(v.length<4)v+=k;draw();
      if(v.length===4){const ok=await onDone(v);if(ok===false){v="";setTimeout(()=>draw(true),120)}else el.remove()}});
    const c=el.querySelector("#lkc");if(c)c.onclick=()=>{el.remove();opts.cancel()}};
  draw();
}
function setPin(done){closeSheet();
  pinPad("Create a PIN","4 digits to open the app",first=>{
    setTimeout(()=>pinPad("Repeat your PIN","Type the same 4 digits again",async second=>{
      if(second!==first){toast("PINs didn't match — try again");setTimeout(()=>setPin(done),50);return true}
      const salt=uid();ls.set(K_PIN,{salt,h:await hashPin(first,salt),bad:0});done();return true}),10);return true});
}
let unlocked=false;const K_SEEN="cw_seen";const markSeen=()=>{if(unlocked)try{localStorage.setItem(K_SEEN,String(Date.now()))}catch(e){}};
setInterval(markSeen,20000);addEventListener("pagehide",markSeen);
function lockIfNeeded(fresh){
  const p=ls.get(K_PIN,null); if(!online()||!p){unlocked=true;return}
  if(fresh){const t=+(localStorage.getItem(K_SEEN)||0);if(t&&Date.now()-t<5*60*1000){unlocked=true;markSeen();return}}
  unlocked=false;
  pinPad("Enter PIN","Hourza is locked",async v=>{
    const p2=ls.get(K_PIN,null); if(await hashPin(v,p2.salt)===p2.h){p2.bad=0;ls.set(K_PIN,p2);unlocked=true;markSeen();pull();return true}
    p2.bad=(p2.bad||0)+1;ls.set(K_PIN,p2);
    if(p2.bad>=5){CONN=null;[K_CONN,K_CACHE,K_OUT,K_PIN].forEach(k=>ls.del(k));OUT=[];DB=ls.get(KEY,null)||EMPTY();render();toast("Too many wrong PINs — this device was disconnected");return true}
    toast(`Wrong PIN · ${5-p2.bad} ${5-p2.bad===1?"try":"tries"} left`);return false});
}
let hiddenAt=0;
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){hiddenAt=Date.now();markSeen()}else if(online()&&unlocked&&hiddenAt&&Date.now()-hiddenAt>5*60*1000&&!document.querySelector(".lock"))lockIfNeeded()});

/* ---- export / backup ---- */
function download(name,text,type){if(location.hostname.includes("claude")){toast("Downloads work in the real app");throw 0}const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
/* ---- import a list of workers and sites (CSV from Excel) ---- */
function impParse(t){t=String(t||"").replace(/^\uFEFF/,"");const sep=(t.split("\n")[0].match(/\t/)?"\t":t.split("\n")[0].match(/;/)&&!t.split("\n")[0].match(/,/)?";":",");
  const rows=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}else if(ch==='"')q=true;else if(ch===sep){row.push(f);f=""}else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;row.push(f);f="";if(row.some(x=>x.trim()))rows.push(row);row=[]}else f+=ch}
  row.push(f);if(row.some(x=>x.trim()))rows.push(row);if(!rows.length)return [];
  const h=rows[0].map(x=>x.trim().toLowerCase()),fi=re=>h.findIndex(x=>re.test(x));let ni=fi(/name|worker|employee|staff|person/),si=fi(/site|location|place|where/),ci=fi(/client|company|customer/),ri=fi(/rate|pay|\$/);let body=rows.slice(1);
  if(ni<0&&si<0){ni=0;si=1;body=rows}if(ni<0)ni=0;
  return body.map(r=>({name:(r[ni]||"").trim().replace(/\s+/g," "),site:si>=0?(r[si]||"").trim().replace(/[,\s]+$/,"").replace(/\s+/g," "):"",client:ci>=0?(r[ci]||"").trim():"",rate:ri>=0?parseFloat(String(r[ri]||"").replace(/[^0-9.]/g,""))||0:0})).filter(x=>x.name)}
function impPlan(list){const lc=x=>x.toLowerCase(),plan=[],cl={},st={},wk={};const now=todayD();
  DB.clients.forEach(c=>cl[lc(c.name)]=c.id);DB.sites.forEach(x=>st[lc(x.name)]=x.id);DB.workers.forEach(w=>wk[lc(w.name)]=w.id);
  let nw=0,ns=0,nc=0,nl=0,same=0;const links=new Set(DB.rates.map(r=>r.workerId+"|"+r.siteId));const old=new Set(DB.workers.map(w=>w.id)),counted=new Set();
  list.forEach(x=>{let cid="";if(x.client){cid=cl[lc(x.client)];if(!cid){cid=uid();cl[lc(x.client)]=cid;plan.push({op:"create",t:"clients",row:{id:cid,name:x.client}});nc++}}
    let sid="";if(x.site){sid=st[lc(x.site)];if(!sid){sid=uid();st[lc(x.site)]=sid;plan.push({op:"create",t:"sites",row:{id:sid,name:x.site,clientId:cid,address:"",billType:"hourly",charge:0,fixed:0}});ns++}}
    let wid=wk[lc(x.name)];if(!wid){wid=uid();wk[lc(x.name)]=wid;plan.push({op:"create",t:"workers",row:{id:wid,name:x.name,active:true,role:"crew",payType:"hourly",salary:0,salaryPer:"",createdAt:now}});nw++}else if(old.has(wid)&&!counted.has(wid)){counted.add(wid);same++}
    if(sid&&!links.has(wid+"|"+sid)){links.add(wid+"|"+sid);plan.push({op:"create",t:"rates",row:{id:uid(),workerId:wid,siteId:sid,rate:x.rate||0,addedAt:now}});nl++}});
  return {plan,nw,ns,nc,nl,same,rows:list.length,norate:list.filter(x=>!x.rate).length}}
function impStart(){showSheet(`<h3>Import workers & sites</h3><div class="lead">Paste a list: one line each — <b>name, site</b> (client and rate are optional: name, site, client, rate).</div>
  <textarea class="inp" id="impt" rows="7" style="height:auto;min-height:150px;padding:12px 14px;line-height:1.45;font-size:15px" placeholder="Name,Site,Client,Rate&#10;Sumana,Burwood,,28&#10;Anish,T Zone Chatswood,T Zone,30"></textarea>
  <button class="btn" style="margin-top:12px" onclick="const t=$('#impt').value;if(!t.trim()){toast('Paste the list first');return}closeSheet();setTimeout(()=>impShow(impParse(t)),250)">Continue</button>
  <button class="btn ghost" onclick="closeSheet();setTimeout(()=>$('#impf').click(),250)">Pick a file instead</button>`)}
function impFile(file){if(!file)return;const r=new FileReader();r.onload=()=>impShow(impParse(r.result));r.onerror=()=>toast("Couldn't read that file");r.readAsText(file)}
function impShow(list){if(!list.length){showSheet(`<h3>Nothing to import</h3><div class="lead">The file needs a column of names and a column of sites. In Excel: File → Save As → CSV.</div><button class="btn" onclick="closeSheet()">OK</button>`);return}
  const P=impPlan(list);IMP=P;
  showSheet(`<h3>Import ${plural(P.rows,"row")}</h3><div class="lead">Nothing already in the app is changed or removed.</div>
  <div class="list" style="margin-bottom:14px">
    <div class="row"><div class="main"><div class="t1">${plural(P.nw,"new worker")}</div>${P.same?`<div class="t2">${P.same} already in the app — kept as they are</div>`:""}</div></div>
    <div class="row"><div class="main"><div class="t1">${plural(P.ns,"new site")}</div></div></div>
    ${P.nc?`<div class="row"><div class="main"><div class="t1">${plural(P.nc,"new client")}</div></div></div>`:""}
    <div class="row"><div class="main"><div class="t1">${plural(P.nl,"worker–site link")}</div>${P.norate?`<div class="t2">${P.norate} without a pay rate — add them later</div>`:""}</div></div>
  </div>
  <div class="t2" style="margin:0 2px 12px;line-height:1.5">First rows: ${list.slice(0,4).map(x=>esc(x.name)+" → "+esc(x.site||"–")).join(", ")}${list.length>4?"…":""}</div>
  <button class="btn" onclick="impGo(this)">Import</button><button class="btn ghost" onclick="closeSheet()">Cancel</button>`)}
let IMP=null;async function impGo(b){const P=IMP;if(!P)return;IMP=null;b.disabled=true;b.textContent="Importing…";const undo=await chgApply(P.plan);closeSheet();
  toast(`✓ Imported ${plural(P.nw,"worker")} and ${plural(P.ns,"site")}`,async()=>{await undo();toast("Import undone")});AIUNDO.push({fn:undo,msg:"the import"})}
function exportCSV(){try{exportCSV_()}catch(e){}}
function exportCSV_(){
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const rows=[["Date","Month","Name","Site","Client","Hours","Rate","Wages","Paid","Paid on","Note"]].concat(
    DB.entries.slice().sort((a,b)=>sortKey(a).localeCompare(sortKey(b))||W(a.workerId).name.localeCompare(W(b.workerId).name))
    .map(e=>[e.date||"whole month",mLabel(e.month),W(e.workerId).name,Sx(e.siteId).name,C(Sx(e.siteId).clientId).name,e.hours,e.rate,wage(e),e.paid?"Yes":"No",e.paidAt,e.notes]));
  download("Hourza_hours.csv","﻿"+rows.map(r=>r.map(q).join(",")).join("\r\n"),"text/csv");toast("✓ Downloaded — opens in Excel");
}
function backup(){try{download(`Hourza_backup_${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(DB),"application/json");toast("✓ Backup downloaded")}catch(e){}}
function restore(file){if(!file)return;const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result);if(!TABLES.every(t=>Array.isArray(d[t])))throw 0;
  if(!confirmBox("Replace everything with this backup?"))return; await replaceAll(d); render(); toast("✓ Backup restored")}catch(e){toast("That file isn't a Crew Wages backup")}};r.readAsText(file)}
function confirmBox(m){try{return window.confirm(m)}catch(e){return true}}
function resetDemo(sample,quiet){if(sample&&online()){toast("Sample data is off while connected to your Sheet");return}if(!quiet&&!confirmBox(sample?"Replace everything with sample data?":"Delete all data on this device?"))return;DB=sample?seed():{clients:[],sites:[],workers:[],rates:[],entries:[],income:[]};saveLocal();state.person=null;if(sample){state.month="2026-11";state.per={mode:"month",d:todayD().startsWith("2026-11")?todayD():"2026-11-01"}}go("home");toast(sample?"Sample data loaded":"All data cleared")}

/* ============ start ============ */
(async()=>{
  $("#app").innerHTML=`<div class="empty" style="padding-top:40vh">Loading…</div>`;
  setTimeout(()=>rosterTick(true),1500);
  try{await load()}catch(e){$("#app").innerHTML=`<div class="empty" style="padding-top:35vh">Couldn't load your data.<br>Check the internet and refresh.</div>`;return}
  const ms=DB.entries.map(e=>e.month).sort(); state.month=online()?nowM():(ms[ms.length-1]||nowM());state.per.d=state.month===todayD().slice(0,7)?todayD():state.month+"-01";
  render(); if(!autoJoin()){lockIfNeeded(true); if(online()&&!ls.get(K_PIN,null))unlocked=true; if(unlocked)pull();}
  setTimeout(showInstallGuide,900);
})();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
